<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Athena">
    <meta name="theme-color" content="#4a9eff">
    <title>Athena AI — Multimodal Chat</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --border: #333;
            --text: #e8e8e8;
            --text-dim: #888;
            --primary: #4a9eff;
            --primary-hover: #6bb0ff;
            --success: #4ade80;
            --error: #f87171;
            --warning: #fbbf24;
            --user-bg: #2a4a7c;
            --assistant-bg: #1a3a1a;
            --code-bg: #2d2d2d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .header-right {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .status-panel {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            font-size: 0.875rem;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            background: var(--code-bg);
        }

        .status-indicator.online {
            color: var(--success);
        }

        .status-indicator.offline {
            color: var(--error);
        }

        .status-indicator.loading {
            color: var(--warning);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .message {
            display: flex;
            gap: 1rem;
            max-width: 800px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message.user .avatar {
            background: var(--user-bg);
        }

        .message.assistant .avatar {
            background: var(--assistant-bg);
        }

        .message-content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .content {
            background: var(--surface);
            padding: 1rem;
            border-radius: 0.75rem;
            line-height: 1.6;
        }

        .message.user .content {
            background: var(--user-bg);
        }

        .message.assistant .content {
            background: var(--code-bg);
        }

        .message-meta {
            font-size: 0.75rem;
            color: var(--text-dim);
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .message-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.25rem 0.5rem;
            font-size: 0.75rem;
            border-radius: 0.25rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-small:hover {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .image-preview {
            max-width: 300px;
            max-height: 300px;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
        }

        .input-container {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 1rem;
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .input-tools {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tool-btn {
            background: var(--code-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .tool-btn:hover {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .tool-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .input-row {
            display: flex;
            gap: 0.75rem;
        }

        textarea {
            flex: 1;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            min-height: 52px;
            max-height: 200px;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        button.send-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.75rem;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.send-btn:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        button.send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            font-size: 0.875rem;
            color: var(--text-dim);
        }

        .status.connected {
            color: var(--success);
        }

        .status.error {
            color: var(--error);
        }

        code {
            background: var(--code-bg);
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.875em;
        }

        pre {
            background: var(--code-bg);
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            margin: 0.5rem 0;
        }

        pre code {
            background: none;
            padding: 0;
        }

        .typing {
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #imageInput {
            display: none;
        }

        .system-status {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.75rem;
            margin: 1rem auto;
            max-width: 800px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .service-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .service-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .service-status .dot.online {
            background: var(--success);
        }

        .service-status .dot.offline {
            background: var(--error);
        }

        .service-status .dot.loading {
            background: var(--warning);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <h1>🤖 Athena AI</h1>
            <div class="subtitle">Multimodal | Model-Agnostic | ASI-Safe | Local-First | 🧠 Self-Learning</div>
        </div>
        <div class="header-right">
            <div class="status-panel">
                <div class="status-indicator loading" id="mainStatus">
                    <span id="statusText">Connecting...</span>
                </div>
                <button class="btn-small" onclick="toggleSystemStatus()">📊 Status</button>
            </div>
        </div>
    </header>

    <div id="systemStatus" class="system-status" style="display: none;">
        <strong>System Services:</strong>
        <div class="status-grid" id="servicesGrid"></div>
    </div>

    <div class="chat-container" id="chat"></div>

    <div class="input-container">
        <div class="input-wrapper">
            <div class="input-tools">
                <input type="file" id="imageInput" accept="image/*" onchange="handleImageSelect(event)">
                <button class="tool-btn" onclick="document.getElementById('imageInput').click()">
                    📎 Add Image
                </button>
                <button class="tool-btn" id="micBtn" onclick="toggleMicrophone()">
                    🎤 Voice Input
                </button>
                <button class="tool-btn" id="searchBtn" onclick="toggleTool('search')">
                    🔍 Web Search
                </button>
                <button class="tool-btn" id="arxivBtn" onclick="toggleTool('arxiv')">
                    📚 ArXiv
                </button>
                <button class="tool-btn" onclick="clearChat()">
                    🗑️ Clear
                </button>
            </div>
            <div class="input-row">
                <textarea 
                    id="input" 
                    placeholder="Ask anything... Athena will choose the best model for your request."
                    rows="1"
                ></textarea>
                <button class="send-btn" id="send" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:8080/v1';
        const ROUTER_URL = 'http://localhost:9113';
        const FASTVLM_URL = 'http://localhost:8088';
        const KOKORO_URL = 'http://localhost:8091';
        const WHISPER_URL = 'http://localhost:8095';
        const MCP_URL = 'http://localhost:8082';

        const chatContainer = document.getElementById('chat');
        const input = document.getElementById('input');
        const sendButton = document.getElementById('send');
        const mainStatus = document.getElementById('mainStatus');
        const statusText = document.getElementById('statusText');

        let messages = [];
        let currentImage = null;
        let activeTool = null;
        let mediaRecorder = null;
        let audioChunks = [];

        // Service health tracking
        const services = {
            'UAI': 'http://localhost:8080/health',
            'Router': 'http://localhost:9113/health',
            'FastVLM': 'http://localhost:8088/health',
            'Kokoro': 'http://localhost:8091/health',
            'Whisper': 'http://localhost:8095/health',
            'MCP': 'http://localhost:8082/health',
            'Judicial': 'http://localhost:8096/v2/health',
            'Federation': 'http://localhost:8097/federation/health',
            'Learning': 'http://localhost:8098/health'
        };

        async function checkAllServices() {
            const grid = document.getElementById('servicesGrid');
            grid.innerHTML = '';

            let onlineCount = 0;
            const total = Object.keys(services).length;

            for (const [name, url] of Object.entries(services)) {
                const serviceDiv = document.createElement('div');
                serviceDiv.className = 'service-status';
                
                try {
                    const res = await fetch(url, { method: 'GET', signal: AbortSignal.timeout(2000) });
                    const isOnline = res.ok;
                    
                    serviceDiv.innerHTML = `
                        <span class="dot ${isOnline ? 'online' : 'offline'}"></span>
                        <span>${name}</span>
                    `;
                    
                    if (isOnline) onlineCount++;
                } catch (e) {
                    serviceDiv.innerHTML = `
                        <span class="dot offline"></span>
                        <span>${name}</span>
                    `;
                }
                
                grid.appendChild(serviceDiv);
            }

            // Update main status
            const allOnline = onlineCount === total;
            mainStatus.className = `status-indicator ${allOnline ? 'online' : (onlineCount > 0 ? 'loading' : 'offline')}`;
            statusText.textContent = `${onlineCount}/${total} Services`;
        }

        function toggleSystemStatus() {
            const panel = document.getElementById('systemStatus');
            if (panel.style.display === 'none') {
                panel.style.display = 'block';
                checkAllServices();
            } else {
                panel.style.display = 'none';
            }
        }

        function toggleTool(tool) {
            if (activeTool === tool) {
                activeTool = null;
                document.getElementById(tool + 'Btn').classList.remove('active');
            } else {
                // Deactivate previous
                if (activeTool) {
                    document.getElementById(activeTool + 'Btn').classList.remove('active');
                }
                activeTool = tool;
                document.getElementById(tool + 'Btn').classList.add('active');
            }
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                currentImage = e.target.result;
                // Show preview in input area
                input.placeholder = `Image selected: ${file.name}. Type your question about this image...`;
            };
            reader.readAsDataURL(file);
        }

        async function toggleMicrophone() {
            const micBtn = document.getElementById('micBtn');
            
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                // Stop recording
                mediaRecorder.stop();
                micBtn.textContent = '🎤 Voice Input';
                micBtn.classList.remove('active');
                input.placeholder = 'Transcribing...';
            } else {
                // Start recording
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioChunks = [];
                    
                    mediaRecorder = new MediaRecorder(stream);
                    
                    mediaRecorder.ondataavailable = (event) => {
                        audioChunks.push(event.data);
                    };
                    
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        await transcribeAudio(audioBlob);
                        
                        // Stop all tracks
                        stream.getTracks().forEach(track => track.stop());
                    };
                    
                    mediaRecorder.start();
                    micBtn.textContent = '⏹️ Stop Recording';
                    micBtn.classList.add('active');
                    input.placeholder = 'Recording... Click again to stop.';
                    
                } catch (error) {
                    console.error('Microphone error:', error);
                    input.placeholder = 'Microphone access denied. Please allow microphone access.';
                }
            }
        }

        async function transcribeAudio(audioBlob) {
            try {
                const formData = new FormData();
                formData.append('audio', audioBlob, 'recording.webm');
                
                const response = await fetch(`${WHISPER_URL}/transcribe`, {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    const data = await response.json();
                    input.value = data.text;
                    input.placeholder = 'Ask anything... Athena will choose the best model for your request.';
                    input.focus();
                } else {
                    input.placeholder = 'Transcription failed. Whisper service may be unavailable.';
                }
                
            } catch (error) {
                console.error('Transcription error:', error);
                input.placeholder = 'Transcription error. Is Whisper service running?';
            }
        }

        // Check health on load
        checkAllServices();
        setInterval(checkAllServices, 30000); // Check every 30s

        // Auto-resize textarea
        input.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        // Send on Enter (Shift+Enter for newline)
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function addMessage(role, content, meta = null) {
            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? 'Y' : '🤖';
            
            const contentWrapper = document.createElement('div');
            contentWrapper.className = 'message-content-wrapper';
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'content';
            
            // Simple markdown-like rendering
            let html = content
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
            
            contentDiv.innerHTML = html;
            contentWrapper.appendChild(contentDiv);
            
            // Add metadata and actions for assistant messages
            if (role === 'assistant' && meta) {
                const metaDiv = document.createElement('div');
                metaDiv.className = 'message-meta';
                metaDiv.innerHTML = `
                    <span>🔍 ${meta.model_used || 'Unknown model'}</span>
                    ${meta.latency_ms ? `<span>⚡ ${meta.latency_ms}ms</span>` : ''}
                `;
                contentWrapper.appendChild(metaDiv);
                
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'message-actions';
                actionsDiv.innerHTML = `
                    <button class="btn-small" onclick="speakText(\`${content.replace(/`/g, '\\`').replace(/\n/g, ' ')}\`)">🔊 Speak</button>
                `;
                contentWrapper.appendChild(actionsDiv);
            }
            
            msg.appendChild(avatar);
            msg.appendChild(contentWrapper);
            chatContainer.appendChild(msg);
            
            // Scroll to bottom
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            return contentDiv;
        }

        async function speakText(text) {
            try {
                const response = await fetch(`${KOKORO_URL}/synthesize`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text: text.substring(0, 500)}) // Limit length
                });
                
                if (response.ok) {
                    const audioBlob = await response.blob();
                    const audioUrl = URL.createObjectURL(audioBlob);
                    const audio = new Audio(audioUrl);
                    audio.play();
                } else {
                    console.warn('TTS service unavailable');
                }
            } catch (e) {
                console.warn('TTS error:', e);
            }
        }

        function clearChat() {
            chatContainer.innerHTML = '';
            messages = [];
            currentImage = null;
            input.placeholder = 'Ask anything... Athena will choose the best model for your request.';
        }

        async function sendMessage() {
            const query = input.value.trim();
            if (!query && !currentImage) return;

            // Disable input
            input.disabled = true;
            sendButton.disabled = true;

            // Determine what to show in user message
            let userMessageContent = query;
            if (currentImage) {
                userMessageContent += '\n[Image attached]';
            }
            if (activeTool) {
                userMessageContent += `\n[Using tool: ${activeTool}]`;
            }

            // Add user message
            messages.push({ role: 'user', content: query });
            addMessage('user', userMessageContent);
            
            const originalPlaceholder = input.placeholder;
            input.value = '';
            input.style.height = 'auto';

            // Add typing indicator
            const typingDiv = addMessage('assistant', '<span class="typing">Thinking...</span>');

            try {
                let response;
                let metadata = {};

                // Route based on input type
                if (currentImage) {
                    // Vision request
                    metadata.model_used = 'FastVLM (vision)';
                    const startTime = Date.now();
                    
                    const formData = new FormData();
                    // Convert base64 to blob
                    const base64Response = await fetch(currentImage);
                    const blob = await base64Response.blob();
                    formData.append('image', blob, 'image.jpg');
                    formData.append('prompt', query || 'Describe this image');
                    
                    const visionResponse = await fetch(`${FASTVLM_URL}/analyze`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (visionResponse.ok) {
                        const data = await visionResponse.json();
                        response = data.analysis || data.description || JSON.stringify(data);
                    } else {
                        response = 'Vision analysis unavailable (FastVLM service not responding)';
                    }
                    
                    metadata.latency_ms = Date.now() - startTime;
                    currentImage = null;
                    input.placeholder = originalPlaceholder;
                    
                } else if (activeTool) {
                    // Tool request
                    metadata.model_used = `MCP Tool: ${activeTool}`;
                    const startTime = Date.now();
                    
                    const toolResponse = await fetch(`${MCP_URL}/tool/${activeTool === 'search' ? 'web_search' : 'arxiv_search'}`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            arguments: { query: query, num_results: 5, max_results: 5 }
                        })
                    });
                    
                    if (toolResponse.ok) {
                        const data = await toolResponse.json();
                        response = JSON.stringify(data, null, 2);
                        
                        // Also send to LLM for natural language summary
                        const summaryResponse = await fetch(`${BASE_URL}/chat/completions`, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                messages: [
                                    {role: 'system', content: `Summarize these ${activeTool} results naturally:`},
                                    {role: 'user', content: response}
                                ]
                            })
                        });
                        
                        if (summaryResponse.ok) {
                            const summaryData = await summaryResponse.json();
                            response = summaryData.choices?.[0]?.message?.content || response;
                        }
                    } else {
                        response = `Tool service unavailable (${activeTool} not responding)`;
                    }
                    
                    metadata.latency_ms = Date.now() - startTime;
                    toggleTool(activeTool); // Deactivate tool
                    
                } else {
                    // Standard text chat
                    metadata.model_used = 'Athena (auto-routed)';
                    const startTime = Date.now();
                    
                    const chatResponse = await fetch(`${BASE_URL}/chat/completions`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            messages: messages,
                            temperature: 0.2
                        })
                    });
                    
                    if (chatResponse.ok) {
                        const data = await chatResponse.json();
                        response = data.choices?.[0]?.message?.content || 'No response';
                    } else {
                        response = 'Chat service unavailable (UAI service not responding)';
                    }
                    
                    metadata.latency_ms = Date.now() - startTime;
                }

                // Update display with response
                let html = response
                    .replace(/`([^`]+)`/g, '<code>$1</code>')
                    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                    .replace(/\n/g, '<br>');
                typingDiv.innerHTML = html;

                // Add metadata display
                const parentMessage = typingDiv.closest('.message-content-wrapper');
                
                const metaDiv = document.createElement('div');
                metaDiv.className = 'message-meta';
                metaDiv.innerHTML = `
                    <span>🔍 ${metadata.model_used}</span>
                    ${metadata.latency_ms ? `<span>⚡ ${metadata.latency_ms}ms</span>` : ''}
                `;
                parentMessage.appendChild(metaDiv);
                
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'message-actions';
                const messageId = Date.now();
                actionsDiv.innerHTML = `
                    <button class="btn-small" onclick="speakText(\`${response.replace(/`/g, '\\`').replace(/\n/g, ' ')}\`)">🔊 Speak</button>
                    <button class="btn-small" id="thumbs-up-${messageId}" onclick="sendFeedback(${messageId}, 'positive', \`${response.substring(0, 100).replace(/`/g, '\\`').replace(/\n/g, ' ')}\`)">👍</button>
                    <button class="btn-small" id="thumbs-down-${messageId}" onclick="sendFeedback(${messageId}, 'negative', \`${response.substring(0, 100).replace(/`/g, '\\`').replace(/\n/g, ' ')}\`)">👎</button>
                `;
                parentMessage.appendChild(actionsDiv);

                // Save to message history
                messages.push({ role: 'assistant', content: response });

            } catch (error) {
                typingDiv.innerHTML = `<span style="color: var(--error);">Error: ${error.message}<br>Check that services are running (docker-compose up -d)</span>`;
                console.error('Chat error:', error);
            } finally {
                // Re-enable input
                input.disabled = false;
                sendButton.disabled = false;
                input.focus();
            }
        }

        async function sendFeedback(messageId, sentiment, responsePreview) {
            try {
                const response = await fetch(`${BASE_URL}/feedback`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        message_id: messageId,
                        sentiment: sentiment,
                        response_preview: responsePreview,
                        timestamp: Date.now()
                    })
                });
                
                if (response.ok) {
                    // Visual feedback
                    const btn = document.getElementById(`thumbs-${sentiment === 'positive' ? 'up' : 'down'}-${messageId}`);
                    if (btn) {
                        btn.style.background = 'var(--success)';
                        btn.style.color = 'white';
                        btn.disabled = true;
                        btn.textContent = sentiment === 'positive' ? '✓ Thanks!' : '✓ Noted';
                    }
                    console.log('✅ Feedback sent to learning pipeline');
                } else {
                    console.warn('Feedback submission failed');
                }
            } catch (error) {
                console.error('Feedback error:', error);
            }
        }

        // Focus input on load
        window.addEventListener('load', () => {
            input.focus();
            console.log('🤖 Athena AI loaded - Model-Agnostic Multimodal Chat');
            console.log('Features: Text | Vision | Voice | Search | ArXiv | Learning');
        });
    </script>
</body>
</html>
