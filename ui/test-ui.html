<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Test - Simple</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .response { background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 4px; border-left: 4px solid #007bff; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 UI Test - Simple Debug Interface</h1>
        
        <div id="status" class="status info">
            Testing connection to Smart Chat service...
        </div>
        
        <div>
            <h3>Test Connection</h3>
            <button onclick="testConnection()">Test API Connection</button>
            <button onclick="testChat()">Test Chat</button>
            <button onclick="clearLog()">Clear Log</button>
        </div>
        
        <div>
            <h3>Send Message</h3>
            <input type="text" id="messageInput" placeholder="Type a message..." value="Hello, how are you?">
            <button onclick="sendMessage()">Send Message</button>
        </div>
        
        <div id="responses"></div>
        
        <div id="log"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8089/v1';
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div class="status ${type}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
            document.getElementById('responses').innerHTML = '';
        }
        
        async function testConnection() {
            log('Testing connection to Smart Chat service...', 'info');
            
            try {
                const response = await fetch('http://localhost:8089/health');
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ Connection successful! Service: ${data.service}, Model: ${data.model}`, 'success');
                    document.getElementById('status').innerHTML = `✅ Connected to ${data.service} (${data.model})`;
                    document.getElementById('status').className = 'status success';
                } else {
                    log(`❌ Connection failed: ${response.status}`, 'error');
                    document.getElementById('status').innerHTML = `❌ Connection failed: ${response.status}`;
                    document.getElementById('status').className = 'status error';
                }
            } catch (error) {
                log(`❌ Connection error: ${error.message}`, 'error');
                document.getElementById('status').innerHTML = `❌ Connection error: ${error.message}`;
                document.getElementById('status').className = 'status error';
            }
        }
        
        async function testChat() {
            log('Testing chat endpoint...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: 'Hello, this is a test message.' }],
                        max_tokens: 50
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ Chat test successful! Response: ${data.choices[0].message.content.substring(0, 100)}...`, 'success');
                    
                    const responsesDiv = document.getElementById('responses');
                    responsesDiv.innerHTML += `<div class="response">
                        <strong>Test Response:</strong><br>
                        ${data.choices[0].message.content}
                    </div>`;
                } else {
                    log(`❌ Chat test failed: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                log(`❌ Chat test error: ${error.message}`, 'error');
            }
        }
        
        async function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value.trim();
            
            if (!message) {
                log('Please enter a message', 'error');
                return;
            }
            
            log(`Sending message: "${message}"`, 'info');
            
            try {
                const response = await fetch(`${API_BASE}/chat/completions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: message }],
                        max_tokens: 200
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ Message sent successfully!`, 'success');
                    
                    const responsesDiv = document.getElementById('responses');
                    responsesDiv.innerHTML += `<div class="response">
                        <strong>You:</strong> ${message}<br>
                        <strong>Assistant:</strong> ${data.choices[0].message.content}
                    </div>`;
                    
                    messageInput.value = '';
                } else {
                    log(`❌ Message failed: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                log(`❌ Message error: ${error.message}`, 'error');
            }
        }
        
        // Auto-test connection on load
        window.onload = function() {
            testConnection();
        };
        
        // Allow Enter key to send message
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
