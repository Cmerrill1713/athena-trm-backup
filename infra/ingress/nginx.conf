# Athena In-Path Governance - Nginx Configuration
# Mirrors all traffic to Athena orchestrator for governance
# Modes: shadow (observe only) | canary (1-5% enforce) | enforce (100%)

# Upstreams
upstream app_upstream {
    server app:8080;
}

upstream athena_orchestrator {
    server host.docker.internal:9110;
}

# Map request ID for tracing
map $request_id $athena_trace {
    default $request_id;
}

# Main server
server {
    listen 80;
    server_name _;

    # Mirror every request to Athena receipt endpoint
    mirror /_athena_mirror;
    mirror_request_body on;

    # Main application proxy
    location / {
        # Set Athena headers
        proxy_set_header X-Athena-Trace      $athena_trace;
        proxy_set_header X-Athena-Policy     ${ATHENA_POLICY_VERSION};
        proxy_set_header X-Athena-Mode       ${ATHENA_MODE};
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;
        proxy_set_header Host                $host;
        
        # Pass to application
        proxy_pass http://app_upstream;
        
        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Internal mirror location - sends receipts to Athena
    location = /_athena_mirror {
        internal;
        
        proxy_method POST;
        proxy_set_header Content-Type application/json;
        proxy_pass http://athena_orchestrator/receipt;
        
        # Build receipt JSON body
        proxy_set_body '{
            "trace_id": "$athena_trace",
            "method": "$request_method",
            "path": "$request_uri",
            "status": $status,
            "req_bytes": $request_length,
            "resp_bytes": $bytes_sent,
            "latency_ms": $upstream_response_time,
            "policy": "${ATHENA_POLICY_VERSION}",
            "mode": "${ATHENA_MODE}",
            "timestamp": "$time_iso8601",
            "client_ip": "$remote_addr"
        }';
        
        # Don't wait for receipt to complete
        proxy_ignore_client_abort on;
        proxy_buffering off;
    }

    # Health check
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

