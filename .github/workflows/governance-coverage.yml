name: Governance Coverage Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "governance/**"
      - "orchestrator/**"
      - "policy/**"
      - "scripts/coverage_gate.sh"
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours

jobs:
  coverage-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Governance Coverage
        env:
          PROM_URL: ${{ secrets.PROM_URL || 'http://localhost:9090' }}
          MIN_COVERAGE: "0.98"
        run: |
          chmod +x scripts/coverage_gate.sh
          bash scripts/coverage_gate.sh

      - name: Report Results
        if: always()
        run: |
          echo "## Governance Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${ATHENA_MODE:-shadow}" >> $GITHUB_STEP_SUMMARY
          echo "**Policy:** ${ATHENA_POLICY_VERSION:-unknown}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See job logs for detailed metrics." >> $GITHUB_STEP_SUMMARY
