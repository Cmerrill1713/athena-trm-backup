name: governance-ci
on: [push, pull_request]
jobs:
  validate:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install jsonschema pyyaml
      - name: Validate Exec receipts
        run: |
          python - <<'PY'
          import json, glob, sys
          from jsonschema import validate
          schema=json.load(open('schemas/exec_receipt.schema.json'))
          for f in glob.glob('**/*receipt*.json', recursive=True):
              try: validate(json.load(open(f)), schema)
              except Exception as e: print(f'❌ {f}: {e}'); sys.exit(1)
          print('✅ receipts OK')
          PY
      - name: Compile policy bundle
        run: |
          python legislative/policy_compiler.py policy/governance_policy.yaml policy/god_judge_verdict_mapping.yaml
      - name: Freeze bundle hash
        run: |
          git diff --exit-code manifests/policy_bundle.json || (echo '❌ policy changed: commit bundle'; exit 1)
