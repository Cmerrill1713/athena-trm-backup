name: Athena CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    name: Security & Secrets Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Check for large files
        run: |
          find . -type f -size +50M | grep -v "\.git" && exit 1 || echo "✅ No large files"

  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pre-commit
          pre-commit install

      - name: Run pre-commit
        run: pre-commit run --all-files || true

      - name: Validate YAML/JSON
        run: |
          find . -name "*.yml" -o -name "*.yaml" | xargs -I {} python3 -c "import yaml; yaml.safe_load(open('{}'))" || true
          find . -name "*.json" | grep -v node_modules | xargs -I {} python3 -c "import json; json.load(open('{}'))" || true

  test:
    name: Quick Smoke Test
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Makefile targets
        run: |
          make --version
          grep -E "^[a-z-]+:" Makefile | head -20 || echo "Makefile found"

      - name: Validate scripts
        run: |
          find scripts -name "*.py" -exec python3 -m py_compile {} \; || echo "Python scripts validated"
          find scripts -name "*.sh" -exec bash -n {} \; || echo "Shell scripts validated"
