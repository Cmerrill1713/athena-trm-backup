name: Nightly Repo Audit

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM daily
  workflow_dispatch:

jobs:
  audit:
    name: Repository Usage Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install audit tools
        run: |
          pip install coverage vulture
      
      - name: Run repo usage audit
        run: |
          chmod +x scripts/audit_repo_usage.sh
          bash scripts/audit_repo_usage.sh || true
      
      - name: Run coverage analysis
        run: |
          coverage run -m pytest -q || true
          coverage report -m > coverage_report.txt || true
      
      - name: Run dead code scan
        run: |
          vulture bridge athena orchestrator agents \
            --min-confidence 80 > vulture_report.txt || true
      
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: |
            audit_report.txt
            coverage_report.txt
            vulture_report.txt
          retention-days: 30
      
      - name: Check for orphans
        id: orphan_check
        run: |
          if grep -q "Likely orphans" audit_report.txt; then
            echo "orphans_found=true" >> $GITHUB_OUTPUT
            echo "⚠️  Orphans detected"
          else
            echo "orphans_found=false" >> $GITHUB_OUTPUT
            echo "✅ No orphans found"
          fi
      
      - name: Post results to MCP Store
        if: always()
        run: |
          curl -X POST http://localhost:8412/v1/store/results \
            -H "Content-Type: application/json" \
            -d "{
              \"agent\": \"nightly-audit\",
              \"service\": \"repo-hygiene\",
              \"status\": \"${{ job.status }}\",
              \"summary\": \"Nightly audit - orphans: ${{ steps.orphan_check.outputs.orphans_found }}\",
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }" || echo "MCP Store not available"
      
      - name: Create issue if orphans found
        if: steps.orphan_check.outputs.orphans_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const orphans = fs.readFileSync('audit_report.txt', 'utf8');
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️  Nightly Audit: Orphan Files Detected',
              body: `## Orphan Files Found\n\nThe nightly audit detected potential orphan files.\n\n### Details\n\`\`\`\n${orphans}\n\`\`\`\n\n### Action Required\nReview audit_report.txt and decide whether to:\n- Keep (document why)\n- Move to /archive\n- Delete\n\nRun \`make audit\` locally for full report.`,
              labels: ['audit', 'tech-debt']
            });

