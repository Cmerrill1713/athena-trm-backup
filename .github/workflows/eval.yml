name: Eval & SLA

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: AI-Projects/universal-ai-tools
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn requests pytest

      - name: Create state directory
        run: |
          mkdir -p AI-Projects/universal-ai-tools/state
          mkdir -p AI-Projects/universal-ai-tools/eval/fixtures

      - name: Start Eval API
        working-directory: AI-Projects/universal-ai-tools
        run: |
          nohup python -m uvicorn tools.eval_api:app --host 127.0.0.1 --port 8788 > eval.log 2>&1 &
          sleep 3
          curl -sSf http://127.0.0.1:8788/health

      - name: Run Evaluations
        working-directory: AI-Projects/universal-ai-tools
        run: |
          echo "📊 Running evaluations..."

          # Run evals for available fixtures
          RESULT=$(curl -sSf -X POST http://127.0.0.1:8788/eval/run \
            -H 'Content-Type: application/json' \
            -d '{"capability":"summarize","limit":0}')

          echo "$RESULT" | python3 -m json.tool

          # Extract pass count
          PASSED=$(echo "$RESULT" | python3 -c "import json, sys; d=json.load(sys.stdin); print(d.get('passed', 0))")
          TOTAL=$(echo "$RESULT" | python3 -c "import json, sys; d=json.load(sys.stdin); print(d.get('total', 1))")

          echo "✅ Passed: $PASSED/$TOTAL"

      - name: Enforce SLA Thresholds
        working-directory: AI-Projects/universal-ai-tools
        run: |
          # Check eval pass rate from SQLite
          if [ ! -f "./state/eval.sqlite" ]; then
            echo "⚠️  No eval database - skipping SLA (first run)"
            exit 0
          fi

          python3 -c '
          import sqlite3, sys
          c = sqlite3.connect("./state/eval.sqlite")
          r = c.execute("SELECT avg(passed)*100, count(*) FROM eval_runs WHERE ts > strftime(\"%s\",\"now\")-86400").fetchone()
          pct, n = (r[0] or 0), (r[1] or 0)
          print(f"Eval pass rate: {pct:.1f}% over {n} cases in last 24h")
          if n > 0 and pct < 80.0:
              print(f"❌ SLA FAILED: Pass rate {pct:.1f}% < 80%")
              sys.exit(1)
          elif n == 0:
              print("⚠️ No eval cases in last 24h (new DB)")
              sys.exit(0)
          else:
              print(f"✅ SLA PASSED: {pct:.1f}% >= 80%")
          '

      - name: Upload Eval Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-state
          path: |
            AI-Projects/universal-ai-tools/state/*.sqlite
            AI-Projects/universal-ai-tools/*.log
          if-no-files-found: warn

      - name: Comment on PR with Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const logPath = 'AI-Projects/universal-ai-tools/eval.log';
            let summary = '📊 Eval Results: Check artifacts for details';

            if (fs.existsSync(logPath)) {
              const log = fs.readFileSync(logPath, 'utf8');
              const lines = log.split('\n').slice(-20).join('\n');
              summary = `## 📊 Eval Summary\n\n\`\`\`\n${lines}\n\`\`\``;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
