name: athena

# ═══════════════════════════════════════════════════════════════════════════
# ATHENA UNIFIED PRODUCTION STACK
# ═══════════════════════════════════════════════════════════════════════════
#
# Complete production stack merging:
#   - A2 Router (9113) - Local-first routing
#   - A3 Governance (9110, 9109, 9111, 9112) - Policy & oversight
#   - Core Services (8888, 8014, 8412) - APIs & tools
#   - Knowledge Services (8088, 8089, 8091) - RAG & context
#   - Observability (9090, 3001, 19999, 9093) - Metrics & monitoring
#   - Storage (5432, 6379, 8090, 8081) - Databases & search
#
# Start: docker-compose up -d
# Status: docker-compose ps
# Logs: docker-compose logs -f
# Stop: docker-compose down
#
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ===========================================================================
  # A2: ATHENA ROUTER (Port 9113) - Local-First Model Routing
  # ===========================================================================

  athena-router:
    build:
      context: ./services/router
      dockerfile: Dockerfile
    container_name: athena-router
    restart: unless-stopped
    ports:
      - "127.0.0.1:9113:9113"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=9113
      - ROUTER_HOST=0.0.0.0
      - ROUTER_POLICY_PATH=/app/policies/local_first.yaml
      # Provider endpoints
      - MLX_ENDPOINT=http://athena-api:8000
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5-coder:7b
      - MCP_URL=http://athena-mcp-ecosystem:8412
      - MCP_BROWSER_ENDPOINT=http://athena-mcp-ecosystem:8412
      - MCP_BROWSER_ENABLE=true
      # Multimodal endpoints
      - FASTVLM_ENDPOINT=http://fastvlm:8088
      - KOKORO_ENDPOINT=http://kokoro-tts:8091
      # Governance
      - GOVERNANCE_URL=http://governance-orchestrator:9110
      # Cloud blocked
      - ATHENA_NO_CLOUD=1
      - ATHENA_FAIL_CLOSED=1
      # REP Coordination (Project Iceberg)
      - ATHENA_REP_ENABLED=true
      - ATHENA_REP_REDIS_URL=redis://athena-redis:6379
      - ATHENA_REP_CHANNEL=athena:rep:routing
      - ATHENA_REP_AGENT_ID=router_primary
      - ATHENA_REP_CALCULATOR_MODE=hybrid # hybrid | rule_based | llm_based
    volumes:
      - ./services/router:/app:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - athena-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9113/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "athena.service=router"
      - "athena.port=9113"
      - "athena.layer=a2"

  # ===========================================================================
  # CORE BACKEND SERVICES
  # ===========================================================================

  athena-api:
    image: universal-ai-tools-python-api:latest
    container_name: athena-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - API_PORT=8000
      - POSTGRES_HOST=athena-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=knowledge_base
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - REDIS_HOST=athena-redis
      - REDIS_PORT=6379
    depends_on:
      - athena-postgres
      - athena-redis
    networks:
      - athena-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "athena.service=api"
      - "athena.port=8888"

  athena-evolutionary:
    image: unified-docker-platform-evolutionary-api:latest
    container_name: athena-evolutionary
    restart: unless-stopped
    ports:
      - "127.0.0.1:8014:8004"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - WEAVIATE_URL=http://athena-weaviate:8080
      - POSTGRES_URL=postgresql://postgres:postgres@athena-postgres:5432/knowledge_base
      - REDIS_URL=redis://athena-redis:6379
    depends_on:
      - athena-weaviate
      - athena-postgres
      - athena-redis
    networks:
      - athena-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "athena.service=evolutionary"
      - "athena.port=8014"

  # ===========================================================================
  # MULTIMODAL SERVICES - Vision + Voice
  # ===========================================================================

  fastvlm:
    build:
      context: ./services/fastvlm
      dockerfile: Dockerfile
    container_name: athena-fastvlm
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      - PYTHONUNBUFFERED=1
      - FASTVLM_PORT=8088
      - FASTVLM_HOST=0.0.0.0
    networks:
      - athena-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s
    labels:
      - "athena.service=fastvlm"
      - "athena.port=8088"
      - "athena.modality=vision"

  kokoro-tts:
    build:
      context: ./services/kokoro
      dockerfile: Dockerfile
    container_name: athena-kokoro
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      - PYTHONUNBUFFERED=1
      - KOKORO_PORT=8091
      - KOKORO_HOST=0.0.0.0
      - KOKORO_VOICE=en_US-female
    networks:
      - athena-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8091/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 90s
    labels:
      - "athena.service=kokoro-tts"
      - "athena.port=8091"
      - "athena.modality=voice"

  athena-whisper:
    build:
      context: ./services/whisper
      dockerfile: Dockerfile
    container_name: athena-whisper
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:8095"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8095
      - WHISPER_MODEL=base
    volumes:
      - whisper_models:/app/models
    networks:
      - athena-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "athena.service=whisper-stt"
      - "athena.port=8095"
      - "athena.modality=voice"

  # ===========================================================================
  # ASI SAFETY - AI REPUBLIC GOVERNANCE
  # ===========================================================================

  ai-republic-judicial:
    build:
      context: ./ai_republic/phase2
      dockerfile: Dockerfile
    container_name: ai-republic-judicial
    restart: unless-stopped
    ports:
      - "127.0.0.1:8096:8096"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8096
    volumes:
      - judicial_state:/app/phase2_state
      - judicial_logs:/app/logs
    networks:
      - athena-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "athena.service=judicial-enforcement"
      - "athena.port=8096"
      - "athena.layer=asi-safety"

  ai-republic-federation:
    build:
      context: ./ai_republic/phase3
      dockerfile: Dockerfile
    container_name: ai-republic-federation
    restart: unless-stopped
    ports:
      - "127.0.0.1:8097:8097"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8097
    volumes:
      - federation_state:/app/federation_state
      - federation_logs:/app/logs
    networks:
      - athena-network
    depends_on:
      - ai-republic-judicial
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8097/federation/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "athena.service=federation-gateway"
      - "athena.port=8097"
      - "athena.layer=asi-safety"

  # ===========================================================================
  # MCP ECOSYSTEM (Port 8412) - Model Context Protocol Tools
  # ===========================================================================

  athena-mcp-ecosystem:
    build:
      context: ./services/mcp-ecosystem
      dockerfile: Dockerfile
    container_name: athena-mcp-ecosystem
    restart: unless-stopped
    ports:
      - "127.0.0.1:8412:8412"
    environment:
      - PYTHONUNBUFFERED=1
      - MCP_PORT=8412
      - MCP_HOST=0.0.0.0
      - MACOS_BRIDGE_URL=http://host.docker.internal:8099  # For AppleScript via native bridge
    volumes:
      - /Users/christianmerrill:/host-home:rw  # Mount user home for filesystem tools
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Access host services
    networks:
      - athena-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8412/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      - "athena.service=mcp-ecosystem"
      - "athena.port=8412"
      - "athena.macos=true"

  # ===========================================================================
  # KNOWLEDGE GROUNDING SERVICES
  # ===========================================================================

  athena-knowledge-gateway:
    image: agi-system/ai-tools/knowledge-gateway:latest
    container_name: athena-knowledge-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8093:8080"
    environment:
      - WEAVIATE_URL=http://athena-weaviate:8080
      - POSTGRES_URL=postgresql://postgres:postgres@athena-postgres:5432/knowledge_base
      - REDIS_URL=redis://athena-redis:6379
    depends_on:
      - athena-weaviate
      - athena-postgres
      - athena-redis
    networks:
      - athena-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "athena.service=knowledge-gateway"
      - "athena.port=8093"

  athena-knowledge-context:
    image: agi-system/ai-tools/knowledge-context:latest
    container_name: athena-knowledge-context
    restart: unless-stopped
    ports:
      - "127.0.0.1:8092:8080"
    environment:
      - WEAVIATE_URL=http://athena-weaviate:8080
      - REDIS_URL=redis://athena-redis:6379
      - POSTGRES_URL=postgresql://postgres:postgres@athena-postgres:5432/knowledge_base
    depends_on:
      - athena-weaviate
      - athena-redis
    networks:
      - athena-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "athena.service=knowledge-context"
      - "athena.port=8092"

  athena-knowledge-sync:
    image: agi-system/ai-tools/knowledge-sync:latest
    container_name: athena-knowledge-sync
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:8080"
    environment:
      - WEAVIATE_URL=http://athena-weaviate:8080
      - POSTGRES_URL=postgresql://postgres:postgres@athena-postgres:5432/knowledge_base
    depends_on:
      - athena-weaviate
      - athena-postgres
    networks:
      - athena-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "athena.service=knowledge-sync"
      - "athena.port=8089"

  # ===========================================================================
  # A3: GOVERNANCE CORE COMPONENTS
  # ===========================================================================

  governance-metrics-exporter:
    build:
      context: ./governance/observability
      dockerfile: Dockerfile
    container_name: governance-metrics-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9109:9109"
    environment:
      - PYTHONUNBUFFERED=1
      - PROMETHEUS_MULTIPROC_DIR=/tmp
    volumes:
      - ./governance:/app/governance:ro
    depends_on:
      - athena-postgres
      - athena-redis
      - athena-prometheus
    networks:
      - athena-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9109/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "1001:1001"
    labels:
      - "athena.service=governance-metrics"
      - "athena.port=9109"
      - "athena.layer=a3"

  governance-orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: governance-orchestrator
    restart: unless-stopped
    ports:
      - "127.0.0.1:9110:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - EXEC_STATE_PATH=/app/state/exec_state.json
      - POSTGRES_HOST=athena-postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=athena-redis
      - REDIS_PORT=6379
      - PROMETHEUS_URL=http://athena-prometheus:9090
    volumes:
      - ./policy:/app/policy:ro
      - ./orchestrator:/app/orchestrator:ro
    depends_on:
      - governance-metrics-exporter
      - athena-postgres
      - athena-redis
      - athena-prometheus
      - athena-api
    networks:
      - athena-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "1001:1001"
    labels:
      - "athena.service=governance-orchestrator"
      - "athena.port=9110"
      - "athena.layer=a3"

  governance-canary-monitor:
    build:
      context: ./governance/executive
      dockerfile: Dockerfile.canary
    container_name: governance-canary-monitor
    restart: unless-stopped
    ports:
      - "127.0.0.1:9111:9111"
    environment:
      - PYTHONUNBUFFERED=1
      - CANARY_WINDOW_SIZE=200
      - CANARY_PORT=9111
      - ROUTER_URL=http://athena-router:9113
      - POSTGRES_HOST=athena-postgres
      - REDIS_HOST=athena-redis
      - PROMETHEUS_URL=http://athena-prometheus:9090
      - PROMETHEUS_PUSHGATEWAY=http://prometheus-pushgateway:9091
    volumes:
      - ./governance:/app/governance:rw
      - ./config:/app/config:ro
    depends_on:
      - governance-orchestrator
      - governance-metrics-exporter
      - athena-prometheus
      - prometheus-pushgateway
      - athena-api
      - athena-evolutionary
    networks:
      - athena-network
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f canary_controller || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "1001:1001"
    labels:
      - "athena.service=canary-monitor"
      - "athena.port=9111"
      - "athena.layer=a3"

  agi-core:
    build:
      context: .
      dockerfile: agi_core/Dockerfile.agi-service
    container_name: agi-core
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      - PYTHONUNBUFFERED=1
      - AGI_SERVICE_PORT=8100
      - REDIS_URL=redis://athena-redis:6379/0
      - POSTGRES_HOST=athena-postgres
      - RAG_URL=http://athena-knowledge-gateway:8080
    volumes:
      - ./agi_core:/app/agi_core:ro
      - ./common:/app/common:ro
      - ./infra:/app/infra:ro
    depends_on:
      - athena-redis
      - athena-knowledge-gateway
    networks:
      - athena-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "athena.service=agi-core"
      - "athena.port=8100"
      - "athena.layer=a2"

  agi-remediator:
    build:
      context: .
      dockerfile: agi_core/Dockerfile
    container_name: agi-remediator
    restart: unless-stopped
    ports:
      - "127.0.0.1:9112:9112"
    environment:
      - PYTHONUNBUFFERED=1
      - EVENT_BUS=${EVENT_BUS:-local}
      - REDIS_URL=redis://athena-redis:6379/0
      - REMEDIATOR_PORT=9112
      - POSTGRES_HOST=athena-postgres
      - PROMETHEUS_URL=http://athena-prometheus:9090
    volumes:
      - ./agi_core:/app/agi_core:ro
      - ./infra:/app/infra:ro
      - ./governance:/app/governance:ro
      - ./sandbox:/app/sandbox:rw
    depends_on:
      - governance-orchestrator
      - athena-redis
      - athena-prometheus
    networks:
      - athena-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9112/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "1001:1001"
    labels:
      - "athena.service=agi-remediator"
      - "athena.port=9112"
      - "athena.layer=a3"

  # ===========================================================================
  # OBSERVABILITY: PROMETHEUS + GRAFANA + MONITORING + OPENTELEMETRY
  # ===========================================================================

  athena-otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: athena-otel-collector
    restart: unless-stopped
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC receiver
      - "127.0.0.1:4318:4318" # OTLP HTTP receiver
      - "127.0.0.1:8889:8889" # Prometheus metrics exporter
      - "127.0.0.1:13133:13133" # Health check
      - "127.0.0.1:1777:1777" # pprof
      - "127.0.0.1:55679:55679" # zpages
    command:
      - "--config=/etc/otel-collector-config.yaml"
    volumes:
      - ./governance/observability/otel-collector-config.yml:/etc/otel-collector-config.yaml:ro
      - otel_data:/tmp
    networks:
      - athena-network
    # OTEL collector minimal image doesn't have health check tools
    # Endpoint is verified working from external tests
    # Commenting out health check to avoid false unhealthy status
    # healthcheck:
    #   test: ["CMD-SHELL", "timeout 5 nc -zv localhost 13133 || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 10s
    labels:
      - "athena.service=otel-collector"
      - "athena.port=4317"
      - "athena.layer=observability"

  # ===========================================================================
  # OLLAMA-ATHENA PROXY (Port 11435) - Smart Routing for Open WebUI
  # ===========================================================================

  athena-proxy:
    build:
      context: ./services/ollama-athena-proxy
      dockerfile: Dockerfile
    container_name: athena-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:11435"
    environment:
      - PORT=11435
      - OLLAMA_URL=http://host.docker.internal:11434
      - ROUTER_URL=http://athena-router:9113
    networks:
      - athena-network
    depends_on:
      - athena-router
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:11435/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  athena-prometheus:
    image: prom/prometheus@sha256:ff7e389acbe064a4823212a500393d40a28a8f362e4b05cbf6742a9a3ef736b2
    container_name: athena-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--storage.tsdb.retention.size=10GB"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - athena-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9090/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "athena.service=prometheus"
      - "athena.port=9090"

  prometheus-pushgateway:
    image: prom/pushgateway@sha256:03738d278e082ee9821df730c741b3b465c251fc2b68a85883def301a55a6215
    container_name: prometheus-pushgateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9091"
    networks:
      - athena-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9091/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "athena.service=pushgateway"
      - "athena.port=9091"

  athena-grafana:
    image: grafana/grafana@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    container_name: athena-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - athena-prometheus
    networks:
      - athena-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "athena.service=grafana"
      - "athena.port=3001"

  athena-netdata:
    image: netdata/netdata:latest
    container_name: athena-netdata
    restart: unless-stopped
    ports:
      - "127.0.0.1:19999:19999"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdata_config:/etc/netdata
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - athena-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19999/api/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "athena.service=netdata"
      - "athena.port=19999"

  athena-alertmanager:
    image: prom/alertmanager@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    container_name: athena-alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/config.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=0.0.0.0:9093"
    networks:
      - athena-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9093/-/healthy",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "athena.service=alertmanager"
      - "athena.port=9093"

  # ===========================================================================
  # METRIC EXPORTERS
  # ===========================================================================

  athena-node-exporter:
    image: prom/node-exporter:latest
    container_name: athena-node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - athena-network
    labels:
      - "athena.service=node-exporter"
      - "athena.port=9100"

  athena-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: athena-postgres-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:postgres@athena-postgres:5432/knowledge_base?sslmode=disable
    depends_on:
      - athena-postgres
    networks:
      - athena-network
    labels:
      - "athena.service=postgres-exporter"
      - "athena.port=9187"

  athena-redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: athena-redis-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9121:9121"
    environment:
      - REDIS_ADDR=athena-redis:6379
    depends_on:
      - athena-redis
    networks:
      - athena-network
    labels:
      - "athena.service=redis-exporter"
      - "athena.port=9121"

  governance-exporter:
    image: prom/node-exporter:latest
    container_name: governance-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9108:9100"
    environment:
      - GATHER_GOVERNANCE_METRICS=true
    depends_on:
      - governance-metrics-exporter
      - governance-orchestrator
      - governance-canary-monitor
    networks:
      - athena-network
    labels:
      - "athena.service=governance-exporter"
      - "athena.port=9108"

  # ===========================================================================
  # INTEGRATION SERVICES
  # ===========================================================================

  # governance-slack-bot:
  #   # Commented out - missing dependencies
  #   # To enable: create Dockerfile.slack-bot and required scripts
  #   build:
  #     context: ./scripts
  #     dockerfile: Dockerfile.slack-bot
  #   container_name: governance-slack-bot
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:8082:8082"
  #   environment:
  #     - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
  #     - PORT=8082
  #   volumes:
  #     - ./logs:/app/logs:rw
  #     - ./state:/app/state:rw
  #     - ./scripts:/app/scripts:ro
  #   depends_on:
  #     - governance-orchestrator
  #     - governance-metrics-exporter
  #   networks:
  #     - athena-network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #   labels:
  #     - "athena.service=slack-bot"
  #     - "athena.port=8082"

  # ===========================================================================
  # STORAGE: POSTGRES + REDIS + WEAVIATE + SEARCH
  # ===========================================================================

  athena-postgres:
    image: postgres:15-alpine
    container_name: athena-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=knowledge_base
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - athena-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "athena.service=postgres"
      - "athena.port=5432"

  athena-redis:
    image: redis:7-alpine
    container_name: athena-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - athena-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "athena.service=redis"
      - "athena.port=6379"

  athena-weaviate:
    image: semitechnologies/weaviate:1.21.0
    container_name: athena-weaviate
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
      - "127.0.0.1:50051:50051"
    environment:
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - ENABLE_MODULES=text2vec-cohere,text2vec-huggingface,text2vec-palm,text2vec-openai,generative-openai,generative-cohere,generative-palm,ref2vec-centroid,reranker-cohere,qna-openai
      - CLUSTER_HOSTNAME=node1
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - athena-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "athena.service=weaviate"
      - "athena.port=8090"

  athena-searxng:
    image: searxng/searxng:latest
    container_name: athena-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - athena-network
    labels:
      - "athena.service=searxng"
      - "athena.port=8081"

  # ===========================================================================
  # AUTONOMOUS ORCHESTRATOR (Port 9114) - Self-Improvement Coordination
  # ===========================================================================

  autonomous-orchestrator:
    build:
      context: ./services/autonomous-orchestrator
      dockerfile: Dockerfile
    container_name: athena-autonomous
    restart: unless-stopped
    ports:
      - "127.0.0.1:9114:9114"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=9114
    networks:
      - athena-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9114/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "athena.service=autonomous-orchestrator"
      - "athena.port=9114"
      - "athena.layer=autonomous"

  # ===========================================================================
  # UNIVERSAL AI TOOLS (Port 8080) - Additional AI Service Layer
  # ===========================================================================

  uai:
    build:
      context: ./AI-Projects/universal-ai-tools
      dockerfile: Dockerfile
    container_name: athena-uai
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8080
      - OLLAMA_URL=http://host.docker.internal:11434
      - LLM_MODEL=qwen2.5:7b
      - FEATURE_MOCK=0
      - BUILD_SHA=${BUILD_SHA:-dev}
    volumes:
      - ./knowledge_base:/app/knowledge_base:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - athena-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "athena.service=uai"
      - "athena.port=8080"

# =============================================================================
# VOLUMES
# =============================================================================


  # ===========================================================================
  # ATHENA LEARNING SYSTEM - Distributed Learning Agents
  # ===========================================================================

  athena-learning:
    build:
      context: ./services/learning-agents
      dockerfile: Dockerfile
    container_name: athena-learning
    restart: unless-stopped
    ports:
      - "127.0.0.1:8098:8098"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8098
      - DB_HOST=athena-postgres
      - DB_PORT=5432
      - DB_NAME=athena
      - DB_USER=athena
      - DB_PASS=athena_local_2024
      - OLLAMA_URL=http://host.docker.internal:11434
      - LLM_MODEL=qwen2.5:7b
      - JUDICIAL_URL=http://ai-republic-judicial:8096
    volumes:
      - learning_state:/app/state
      - learning_logs:/app/logs
    networks:
      - athena-network
    depends_on:
      - athena-postgres
      - ai-republic-judicial
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8098/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "athena.service=learning-system"
      - "athena.port=8098"
      - "athena.layer=autonomous"

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  postgres_data:
    name: athena_postgres_data
    external: true
  redis_data:
    name: athena_redis_data
    external: true
  weaviate_data:
    name: athena_weaviate_data
    external: true
  whisper_models:
  judicial_state:
  judicial_logs:
  federation_state:
  federation_logs:
  learning_state:
  learning_logs:
  prometheus_data:
    name: athena_prometheus_data
    external: true
  grafana_data:
    name: athena_grafana_data
    external: true
  netdata_config:
    name: athena_netdata_config
    external: true
  netdata_lib:
    name: athena_netdata_lib
    external: true
  netdata_cache:
    name: athena_netdata_cache
    external: true
  netdata_data:
    name: athena_netdata_data
    external: true
  alertmanager_data:
  otel_data:
    name: athena_otel_data
    external: true

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  athena-network:
    name: athena-network
    driver: bridge
    external: true
