# Constitutional AI Policy Template
# ================================
#
# This template defines the governance framework for autonomous intelligence evolution.
# It establishes ethical boundaries, business constraints, safety limits, and compliance
# rules that guide the system's evolution within beneficial boundaries.
#
# Usage: Load this template into the governance engine to establish constitutional rules.
# Example: governance_engine.load_constitution_from_yaml('constitutional_policy_template.yaml')

metadata:
  version: "1.0.0"
  created_at: "2025-10-13"
  last_modified: "2025-10-13"
  author: "NeuroForge Constitutional AI Framework"
  description: "Complete governance framework for beneficial AI evolution"
  applicable_domains: ["search_optimization", "content_generation", "recommendation_systems"]

# =============================================================================
# ETHICAL BOUNDARIES - Prevent harmful or biased strategies
# =============================================================================

ethical_boundaries:
  enabled: true
  enforcement_level: "blocking"  # blocking, warning, permissive

  # Forbidden patterns in strategy components
  forbidden_patterns:
    discrimination:
      - pattern: "(?i)discriminat.*(race|gender|age|religion|ethnicity|nationality)"
      - pattern: "(?i)bias.*(group|class|category|demographic)"
      - severity: "high"
      - description: "Strategies must not discriminate based on protected characteristics"

    manipulation:
      - pattern: "(?i)manipulat.*(user|behavior|decision|choice)"
      - pattern: "(?i)exploit.*(vulnerability|weakness|addiction)"
      - severity: "high"
      - description: "Strategies must not manipulate or exploit users"

    deception:
      - pattern: "(?i)mislead.*(user|information|results)"
      - pattern: "(?i)fake.*(response|outcome|data)"
      - pattern: "(?i)decept.*(strategy|approach|method)"
      - severity: "high"
      - description: "Strategies must not deceive or mislead users"

    privacy_violation:
      - pattern: "(?i)bypass.*(privacy|consent|permission)"
      - pattern: "(?i)leak.*(personal|private|sensitive)"
      - pattern: "(?i)track.*(without.*consent|covertly|secretly)"
      - severity: "critical"
      - description: "Strategies must respect user privacy and consent"

    harmful_content:
      - pattern: "(?i)generat.*(harmful|dangerous|illegal|toxic)"
      - pattern: "(?i)promot.*(violence|hate|crime|self.*harm)"
      - pattern: "(?i)encourag.*(illegal|dangerous|harmful)"
      - severity: "critical"
      - description: "Strategies must not generate or promote harmful content"

  # Parameter constraints for ethical compliance
  parameter_constraints:
    personalization_bias:
      max_value: 0.3
      description: "Personalization bias must not exceed 0.3 to prevent filter bubbles"
      enforcement: "warning"

    diversity_penalty:
      min_value: -0.5
      description: "Diversity penalties must not be too negative"
      enforcement: "blocking"

  # Component combination rules
  component_rules:
    - name: "personalization_requires_diversity"
      condition: "personalization IN components AND diversity_promotion NOT IN components"
      severity: "medium"
      description: "Personalization without diversity may create unfair outcomes"
      enforcement: "warning"

    - name: "high_manipulation_risk"
      condition: "user_feedback_integration IN components AND personalization IN components AND diversity_promotion NOT IN components"
      severity: "high"
      description: "High risk of user manipulation without diversity safeguards"
      enforcement: "blocking"

# =============================================================================
# BUSINESS CONSTRAINTS - Ensure alignment with organizational objectives
# =============================================================================

business_constraints:
  enabled: true
  enforcement_level: "warning"  # blocking, warning, permissive

  # Business objectives with weights and thresholds
  objectives:
    user_satisfaction:
      weight: 0.4
      min_threshold: 0.7
      description: "Maintain high user satisfaction scores"
      metrics: ["judge_helpfulness", "user_acceptance_rate"]

    business_value:
      weight: 0.3
      min_threshold: 0.6
      description: "Contribute to business revenue and growth"
      metrics: ["conversion_impact", "engagement_lift"]

    operational_efficiency:
      weight: 0.3
      min_threshold: 0.8
      description: "Maintain operational efficiency and cost-effectiveness"
      metrics: ["latency_p95", "resource_usage", "cost_efficiency"]

  # Business rule constraints
  business_rules:
    - name: "latency_sla_compliance"
      condition: "latency_impact > 100"  # ms increase
      severity: "high"
      description: "Strategies must not violate latency SLAs"
      enforcement: "blocking"

    - name: "cost_efficiency_requirement"
      condition: "resource_usage_multiplier > 1.5"
      severity: "medium"
      description: "Strategies must maintain cost efficiency"
      enforcement: "warning"

    - name: "minimum_performance_improvement"
      condition: "judge_score_improvement < 0.05"
      severity: "low"
      description: "Strategies should provide meaningful performance improvement"
      enforcement: "permissive"  # Log but allow

# =============================================================================
# SAFETY LIMITS - Prevent system instability and performance degradation
# =============================================================================

safety_limits:
  enabled: true
  enforcement_level: "blocking"  # blocking, warning, permissive

  # Performance stability limits
  performance_limits:
    variance_threshold:
      max_value: 0.2  # 20% max variance
      description: "Maximum allowed performance variance across queries"
      enforcement: "blocking"

    error_rate_increase:
      max_value: 0.05  # 5% max increase
      description: "Maximum allowed error rate increase"
      enforcement: "blocking"

    latency_regression:
      max_value: 100  # ms max increase
      description: "Maximum allowed latency increase (p95)"
      enforcement: "blocking"

  # Resource usage limits
  resource_limits:
    cpu_usage_multiplier:
      max_value: 2.0
      description: "Maximum CPU usage multiplier"
      enforcement: "warning"

    memory_usage_multiplier:
      max_value: 1.8
      description: "Maximum memory usage multiplier"
      enforcement: "warning"

    storage_impact:
      max_value: 500  # MB increase
      description: "Maximum storage usage increase"
      enforcement: "permissive"

  # System stability limits
  stability_limits:
    rollback_complexity:
      max_value: 3  # max steps to rollback
      description: "Maximum complexity for system rollback"
      enforcement: "blocking"

    deployment_risk:
      max_value: 0.1  # 10% max deployment risk
      description: "Maximum allowed deployment failure risk"
      enforcement: "warning"

# =============================================================================
# COMPLIANCE RULES - Maintain regulatory and legal requirements
# =============================================================================

compliance_rules:
  enabled: true
  enforcement_level: "blocking"  # blocking, warning, permissive

  # GDPR compliance requirements
  gdpr:
    enabled: true
    rules:
      - name: "data_minimization"
        condition: "data_processing_ratio > 2.0"
        description: "Limit data processing to necessary minimum"
        enforcement: "warning"

      - name: "purpose_limitation"
        condition: "data_used_for_unauthorized_purpose = true"
        description: "Use data only for intended purposes"
        enforcement: "blocking"

      - name: "consent_requirement"
        condition: "requires_user_consent = true AND consent_mechanism_missing = true"
        description: "Require explicit user consent for personalization"
        enforcement: "blocking"

      - name: "data_retention"
        condition: "data_retention_days > 90"
        description: "Limit data retention to necessary periods"
        enforcement: "warning"

  # CCPA compliance requirements
  ccpa:
    enabled: true
    rules:
      - name: "right_to_know"
        condition: "data_usage_transparency_missing = true"
        description: "Users must know what data is collected"
        enforcement: "blocking"

      - name: "right_to_delete"
        condition: "data_deletion_mechanism_missing = true"
        description: "Users must be able to delete their data"
        enforcement: "blocking"

      - name: "opt_out_capability"
        condition: "opt_out_mechanism_missing = true"
        description: "Users must be able to opt out of data sharing"
        enforcement: "blocking"

  # Fairness and bias requirements
  fairness:
    enabled: true
    rules:
      - name: "disparate_impact_prevention"
        condition: "performance_disparity > 0.15"  # 15% max difference
        description: "Prevent disproportionate negative effects on user groups"
        enforcement: "blocking"

      - name: "equal_opportunity"
        condition: "outcome_disparity > 0.2"
        description: "Ensure equal performance opportunities across groups"
        enforcement: "warning"

      - name: "transparency_requirement"
        condition: "decision_explainability_missing = true"
        description: "Decisions must be explainable to users"
        enforcement: "warning"

# =============================================================================
# GOVERNANCE POLICIES - High-level policy framework
# =============================================================================

governance_policies:
  - policy_id: "ethical_no_harm"
    category: "ethical"
    name: "No Harm Principle"
    description: "Strategies must not cause harm, discrimination, or manipulation"
    enforcement_level: "blocking"
    conditions:
      - type: "ethical_check"
        max_severity: 0.0
    actions:
      - type: "block_deployment"
        reason: "Ethical violation detected"

  - policy_id: "business_value_creation"
    category: "business"
    name: "Value Creation"
    description: "Strategies must create business value and user satisfaction"
    enforcement_level: "warning"
    conditions:
      - type: "business_alignment"
        min_score: 0.6
    actions:
      - type: "flag_for_review"
        reason: "Low business alignment"

  - policy_id: "safety_system_stability"
    category: "safety"
    name: "System Stability"
    description: "Strategies must maintain system stability and performance"
    enforcement_level: "blocking"
    conditions:
      - type: "safety_check"
        min_safety_score: 0.8
    actions:
      - type: "block_deployment"
        reason: "Safety violation - system instability risk"

  - policy_id: "compliance_legal_requirements"
    category: "compliance"
    name: "Legal Compliance"
    description: "Strategies must comply with all applicable laws and regulations"
    enforcement_level: "blocking"
    conditions:
      - type: "compliance_check"
        min_compliance_score: 0.9
    actions:
      - type: "block_deployment"
        reason: "Regulatory compliance violation"

  - policy_id: "performance_continuous_improvement"
    category: "performance"
    name: "Continuous Improvement"
    description: "Strategies should improve performance over baseline"
    enforcement_level: "permissive"
    conditions:
      - type: "performance_check"
        min_improvement: 0.0  # Allow neutral performance
    actions:
      - type: "log_performance"
        reason: "Performance assessment completed"

  - policy_id: "resource_efficiency"
    category: "resource"
    name: "Resource Efficiency"
    description: "Strategies must use resources efficiently"
    enforcement_level: "warning"
    conditions:
      - type: "resource_check"
        max_complexity: 4.0
    actions:
      - type: "optimize_resources"
        reason: "High resource usage detected"

# =============================================================================
# STRATEGIC OBJECTIVES - High-level guidance for evolution
# =============================================================================

strategic_objectives:
  enabled: true

  # Primary objectives (weighted)
  primary_objectives:
    user_experience_excellence:
      weight: 0.35
      description: "Deliver exceptional user experiences"
      metrics: ["judge_helpfulness", "user_satisfaction", "response_quality"]

    business_growth:
      weight: 0.30
      description: "Drive business growth and revenue"
      metrics: ["conversion_rate", "engagement_metrics", "business_impact"]

    operational_excellence:
      weight: 0.25
      description: "Maintain operational efficiency and reliability"
      metrics: ["latency_p95", "error_rate", "resource_efficiency"]

    innovation_leadership:
      weight: 0.10
      description: "Lead in AI innovation and capability advancement"
      metrics: ["novel_strategy_deployment", "performance_improvements", "research_impact"]

  # Evolution guidance parameters
  evolution_guidance:
    exploration_vs_exploitation: 0.7  # 70% exploration, 30% exploitation
    risk_tolerance: "moderate"  # conservative, moderate, aggressive
    innovation_priority: "balanced"  # safety, balanced, innovation
    adaptation_speed: "adaptive"  # slow, adaptive, fast

# =============================================================================
# HUMAN OVERSIGHT CONFIGURATION
# =============================================================================

human_oversight:
  enabled: true

  # Escalation triggers
  escalation_triggers:
    - condition: "governance_score < 0.5"
      reason: "Critical governance violations"
      priority: "urgent"

    - condition: "ethical_severity_score > 1.0"
      reason: "High ethical risk detected"
      priority: "high"

    - condition: "business_alignment < 0.4"
      reason: "Severe business misalignment"
      priority: "high"

    - condition: "safety_score < 0.6"
      reason: "Significant safety concerns"
      priority: "urgent"

    - condition: "compliance_score < 0.8"
      reason: "Compliance risks detected"
      priority: "high"

  # Review workflow
  review_workflow:
    initial_assessment: "automated"
    human_review_threshold: 0.7  # Governance score threshold for human review
    review_timeout_hours: 24
    fallback_decision: "block"  # block, allow, defer

  # Intervention capabilities
  intervention_capabilities:
    - type: "approve_with_conditions"
      description: "Approve strategy with specific conditions"
      conditions_available:
        - "reduce_personalization_bias"
        - "add_diversity_component"
        - "implement_transparency_measures"
        - "limit_rollout_percentage"
        - "add_monitoring_requirements"

    - type: "reject_strategy"
      description: "Permanently reject strategy"
      reasons_available:
        - "ethical_violations"
        - "safety_concerns"
        - "compliance_issues"
        - "business_misalignment"
        - "technical_infeasibility"

# =============================================================================
# MONITORING AND REPORTING
# =============================================================================

monitoring:
  enabled: true

  # Governance metrics to track
  metrics_to_track:
    - governance_clearance_rate
    - ethical_violation_rate
    - business_alignment_score
    - safety_incident_rate
    - compliance_violation_rate
    - human_intervention_rate

  # Reporting configuration
  reporting:
    frequency: "daily"  # daily, weekly, monthly
    recipients: ["ai-governance@company.com", "compliance@company.com"]
    report_format: "executive_summary"  # detailed, executive_summary, alerts_only

  # Alert thresholds
  alerts:
    - metric: "governance_clearance_rate"
      threshold: 0.8
      condition: "below"
      severity: "high"
      message: "Governance clearance rate below acceptable threshold"

    - metric: "ethical_violation_rate"
      threshold: 0.05
      condition: "above"
      severity: "critical"
      message: "Ethical violation rate exceeds acceptable threshold"

    - metric: "human_intervention_rate"
      threshold: 0.1
      condition: "above"
      severity: "medium"
      message: "Human intervention rate indicates governance automation issues"

# =============================================================================
# EVOLUTION PARAMETERS - How the constitution evolves
# =============================================================================

evolution_parameters:
  enabled: true

  # Constitution evolution rules
  constitution_evolution:
    adaptation_rate: 0.1  # How quickly constitution adapts (0-1)
    feedback_window_days: 30  # Historical window for learning
    minimum_evidence_threshold: 10  # Min data points before adaptation

    # Policy evolution triggers
    evolution_triggers:
      - condition: "policy_violation_rate > 0.3"
        action: "tighten_policy"
        description: "Automatically tighten policy if violation rate is high"

      - condition: "false_positive_rate > 0.2"
        action: "loosen_policy"
        description: "Loosen policy if too many good strategies are blocked"

      - condition: "business_alignment_avg < 0.6"
        action: "update_business_weights"
        description: "Adjust business objective weights based on performance"

  # Meta-learning configuration
  meta_learning:
    enabled: true
    learning_rate: 0.01
    regularization_strength: 0.1
    feature_importance_tracking: true

# =============================================================================
# DEPLOYMENT CONFIGURATION
# =============================================================================

deployment:
  environment: "production"
  risk_profile: "moderate"  # conservative, moderate, aggressive

  # Deployment phases
  deployment_phases:
    - phase: "development"
      governance_level: "permissive"
      testing_required: false

    - phase: "staging"
      governance_level: "warning"
      testing_required: true

    - phase: "production"
      governance_level: "blocking"
      testing_required: true
      human_approval_required: true

  # Rollback configuration
  rollback:
    automatic_rollback_enabled: true
    rollback_triggers:
      - metric: "performance_degradation"
        threshold: 0.1  # 10% degradation
        window_minutes: 30

      - metric: "error_rate_spike"
        threshold: 2.0  # 2x increase
        window_minutes: 15

      - metric: "governance_violation"
        threshold: 1  # Any violation
        window_minutes: 5

# =============================================================================
# CUSTOM EXTENSIONS - Organization-specific rules
# =============================================================================

custom_extensions:
  enabled: false  # Set to true to enable custom rules

  # Example custom policies for specific use cases
  custom_policies:
    - policy_id: "industry_specific_compliance"
      category: "compliance"
      name: "Industry-Specific Requirements"
      description: "Additional compliance rules for specific industry"
      # Add industry-specific conditions here

    - policy_id: "brand_safety"
      category: "ethical"
      name: "Brand Safety"
      description: "Ensure strategies align with brand values"
      # Add brand-specific conditions here

  # Custom metrics and monitoring
  custom_metrics: []
  custom_alerts: []
