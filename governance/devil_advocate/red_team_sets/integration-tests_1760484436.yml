name: Integration Tests

on:
  push:
    branches: [ main, v0.9.*, develop ]
    paths:
      - 'bridge/**'
      - 'tests/interop/**'
      - 'scripts/acceptance_test.sh'
      - '.github/workflows/integration-tests.yml'
  pull_request:
    branches: [ main, v0.9.*, develop ]
    paths:
      - 'bridge/**'
      - 'tests/interop/**'

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx
          cd bridge && pip install -r requirements.txt

      - name: Start Bridge
        run: |
          cd bridge
          nohup python -m uvicorn adapter:app --host 127.0.0.1 --port 8014 > adapter.log 2>&1 &
          sleep 3
          curl -s http://127.0.0.1:8014/health || echo "Bridge not ready"

      - name: Run Smoke Tests
        env:
          BRIDGE_BASE: http://127.0.0.1:8014
        run: |
          pytest -m smoke tests/interop/

      - name: Run E2E Tests
        env:
          BRIDGE_BASE: http://127.0.0.1:8014
        run: |
          pytest -m e2e tests/interop/

      - name: Run SLO Tests
        env:
          BRIDGE_BASE: http://127.0.0.1:8014
          SLO_P95_MS: "250"
        run: |
          pytest -m slo tests/interop/

      - name: Upload Bridge Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-logs
          path: bridge/adapter.log

      - name: Cleanup
        if: always()
        run: |
          pkill -f "uvicorn bridge.adapter:app" || true
