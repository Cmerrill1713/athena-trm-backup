receivers:
    otlp:
        protocols:
            grpc:
                endpoint: 0.0.0.0:4317
            http:
                endpoint: 0.0.0.0:4318
                cors:
                    allowed_origins:
                        - "*"
                    allowed_headers:
                        - "*"

    # Prometheus receiver for scraping metrics
    prometheus:
        config:
            scrape_configs:
                - job_name: "athena-services"
                  static_configs:
                      - targets:
                            - "athena-router:9113"
                            - "athena-api:8000"
                            - "athena-evolutionary:8004"
                            - "governance-orchestrator:8000"
                            - "governance-metrics-exporter:8000"
                            - "agi-core:8100"
                            - "agi-remediator:9112"
                  scrape_interval: 15s
                  metrics_path: "/metrics"
                  scrape_timeout: 10s
                - job_name: "athena-knowledge-services"
                  static_configs:
                      - targets:
                            - "athena-knowledge-gateway:8080"
                            - "athena-knowledge-context:8080"
                            - "athena-knowledge-sync:8080"
                  scrape_interval: 15s
                  metrics_path: "/metrics"
                  scrape_timeout: 10s
                - job_name: "athena-multimodal"
                  static_configs:
                      - targets:
                            - "athena-fastvlm:8088"
                            - "athena-kokoro:8091"
                            - "athena-mcp-ecosystem:8412"
                  scrape_interval: 15s
                  metrics_path: "/metrics"
                  scrape_timeout: 10s

processors:
    # Batch processor to optimize export
    batch:
        timeout: 5s
        send_batch_size: 1024
        send_batch_max_size: 2048

    # Memory limiter to prevent OOM
    memory_limiter:
        limit_percentage: 90
        check_interval: 1s

    # Resource processor to add service info
    resource:
        attributes:
            - key: service.name
              value: athena-stack
              action: upsert
            - key: service.version
              value: 1.0.0
              action: upsert
            - key: deployment.environment
              value: production
              action: upsert
            - key: athena.stack
              value: unified
              action: upsert

    # Probabilistic sampler for high-volume traces (reduced for production)
    probabilistic_sampler:
        sampling_percentage: 10 # 10% sampling for production

    # Attribute processor for custom enrichment
    attributes:
        actions:
            - key: ai.service
              action: upsert
              value: athena-stack
            - key: telemetry.sdk.name
              action: upsert
              value: opentelemetry
            - key: athena.component
              action: upsert
              value: observability

exporters:
    # Prometheus exporter for metrics
    prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "athena"
        const_labels:
            service: "athena-stack"
            environment: "production"

    # Debug exporter (keep in dev only; remove in prod)
    debug:
        verbosity: normal
        sampling_initial: 5
        sampling_thereafter: 200

extensions:
    # Health check extension
    health_check:
        endpoint: 0.0.0.0:13133

    # pprof extension for profiling
    pprof:
        endpoint: 0.0.0.0:1777

    # zpages extension for diagnostics
    zpages:
        endpoint: 0.0.0.0:55679

service:
    extensions: [health_check, pprof, zpages]

    pipelines:
        # Traces pipeline
        traces:
            receivers: [otlp]
            processors:
                [
                    memory_limiter,
                    resource,
                    attributes,
                    probabilistic_sampler,
                    batch,
                ]
            exporters: [debug]

        # Metrics pipeline
        metrics:
            receivers: [otlp, prometheus]
            processors: [memory_limiter, resource, batch]
            exporters: [prometheus, debug]

        # Logs pipeline (when available)
        logs:
            receivers: [otlp]
            processors: [memory_limiter, resource, batch]
            exporters: [debug]

    telemetry:
        logs:
            level: "info"
        metrics:
            level: "detailed"
