# Blackbox Exporter Configuration
# Outside-in monitoring for HTTP endpoints

modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      headers:
        User-Agent: "Blackbox/1.0"
      valid_status_codes: [200, 201, 202, 204]
      fail_if_ssl: false
      fail_if_not_ssl: false

  http_post_2xx:
    prober: http
    timeout: 10s
    http:
      method: POST
      headers:
        Content-Type: "application/json"
        User-Agent: "Blackbox/1.0"
      body: '{"message":"health_check"}'
      valid_status_codes: [200, 201, 202]
      fail_if_ssl: false
      fail_if_not_ssl: false

  tcp_connect:
    prober: tcp
    timeout: 5s

  icmp:
    prober: icmp
    timeout: 5s
