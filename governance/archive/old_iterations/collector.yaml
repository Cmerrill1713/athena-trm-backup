# OpenTelemetry Collector Configuration
# Receives traces from services and exports to logging/tempo

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  logging:
    loglevel: info
    sampling_initial: 5
    sampling_thereafter: 200

  # Uncomment when you have Tempo/Jaeger
  # otlp:
  #   endpoint: tempo:4317
  #   tls:
  #     insecure: true

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

  # Add service metadata
  resource:
    attributes:
      - key: deployment.environment
        value: ${env:ENV}
        action: upsert

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [logging]  # Add 'otlp' when Tempo is available

  telemetry:
    logs:
      level: info
