# Temporary config for v1.0.3 blocker resolution
# Only critical safety violations are errors

disabled_rules:
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - identifier_name
  - todo
  - unused_import
  - attributes
  - closure_end_indentation
  - closure_spacing
  - empty_count
  - implicit_return
  - opening_brace
  - static_over_final_class
  - large_tuple
  - multiple_closures_with_trailing_closure
  - for_where
  - implicit_optional_initialization

opt_in_rules:
  - force_unwrapping

included:
  - NeuroForgeApp/Sources
  - NeuroForgeApp/Tests

excluded:
  - Scripts
  - third_party
  - .build
  - NeuroForgeApp/.build

# Only critical safety violations
force_unwrapping: error