# Promtail Configuration
# Ships logs from containers and files to Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'
        replacement: '$1'
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'

  # Platform service logs (stdout/stderr)
  - job_name: platform_services
    static_configs:
      - targets:
          - localhost
        labels:
          job: platform_services
          __path__: /var/log/platform/*.log
    pipeline_stages:
      - regex:
          expression: '^\[(?P<service>\w+)\]\s+(?P<level>\w+)\s+(?P<message>.*)$'
      - labels:
          service:
          level:

  # MCP service logs
  - job_name: mcp_services
    static_configs:
      - targets:
          - localhost
        labels:
          job: mcp_services
          __path__: /var/log/mcp/*.log
    pipeline_stages:
      - json:
          expressions:
            service: service
            level: level
            message: message
            trace_id: trace_id
      - labels:
          service:
          level:

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/system.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\w+\s+\d+\s+\d+:\d+:\d+)\s+(?P<hostname>\w+)\s+(?P<program>\w+)\s*\[\d+\]:\s+(?P<message>.*)$'
      - labels:
          hostname:
          program:
