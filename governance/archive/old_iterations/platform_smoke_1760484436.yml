name: Platform Smoke Test

on:
  push:
    branches: [ main, tier4-foundation, v0.9.2-dev ]
  pull_request:
    branches: [ main, tier4-foundation ]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [core, voice, rag]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl
      
      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-tier4.txt || true
      
      - name: Start stack (${{ matrix.profile }})
        run: |
          export META_PROMPTING=1
          export META_REFLECTION=1
          export META_RAG=1
          
          case "${{ matrix.profile }}" in
            core)  make stack-up ;;
            voice) make stack-up && make stack-voice ;;
            rag)   make stack-up && make stack-rag ;;
          esac
          
          sleep 5
      
      - name: Verify core services
        run: |
          curl -fsS http://127.0.0.1:8014/ready || exit 1
          curl -fsS http://127.0.0.1:8090/ready || exit 1
          curl -fsS http://127.0.0.1:8181/ready || exit 1
      
      - name: Test chat endpoint
        run: |
          curl -sS -D /tmp/headers.txt \
            -H 'Content-Type: application/json' \
            -X POST http://127.0.0.1:8014/api/chat \
            --data '{"kind":"smalltalk","text":"health check"}' \
            -o /tmp/response.json
          
          # Verify response has content
          test -s /tmp/response.json
          jq -e '.text // .content // .message' /tmp/response.json
          
          # Check for meta headers (warn if missing)
          grep -qi '^x-meta-' /tmp/headers.txt || echo "⚠️ Meta headers not present"
      
      - name: Check stack truth
        run: |
          make truth || true
      
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Bridge logs ==="
          tail -100 logs/bridge_8014.log 2>/dev/null || echo "No bridge log"
          echo ""
          echo "=== Athena logs ==="
          tail -100 logs/athena_8090.log 2>/dev/null || echo "No athena log"
          echo ""
          echo "=== UAT logs ==="
          tail -100 logs/uat_8181.log 2>/dev/null || echo "No UAT log"
      
      - name: Cleanup
        if: always()
        run: |
          make stack-down || true

