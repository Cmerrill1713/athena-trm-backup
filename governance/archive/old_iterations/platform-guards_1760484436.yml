name: Platform Guards
on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'NeuroForgeApp/Sources/**'
      - '.swiftlint.yml'
  push:
    branches: [ main ]
    paths:
      - 'NeuroForgeApp/Sources/**'
      - '.swiftlint.yml'

jobs:
  lint:
    name: "Lint & Platform Guards"
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint --strict --reporter github-actions-logging

  build-macos:
    name: "Build macOS"
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build for macOS
        run: xcodebuild -scheme NeuroForgeApp -destination 'platform=macOS' build

  build-ios:
    name: "Build iOS"
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build for iOS Simulator
        run: xcodebuild -scheme NeuroForgeApp -destination 'platform=iOS Simulator,name=iPhone 15' build

  test-macos:
    name: "Test macOS"
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run macOS tests
        run: xcodebuild -scheme NeuroForgeApp -destination 'platform=macOS' test

  test-ios:
    name: "Test iOS"
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run iOS tests
        run: xcodebuild -scheme NeuroForgeApp -destination 'platform=iOS Simulator,name=iPhone 15' test

