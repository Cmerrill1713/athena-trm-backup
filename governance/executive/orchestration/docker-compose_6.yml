name: universal-ai-tools

services:
  # MCP Ecosystem - Complete multi-SDK container
  mcp-ecosystem:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-ecosystem
    restart: unless-stopped
    command: python3 /mcp/start_all_servers.py
    ports:
      - "8412:8412"
    environment:
      # MCP Store integration (optional - start separately with make mcp-store-up)
      - MCPSTORE_URL=http://host.docker.internal:8411
      
      # OpenAI (for Pydantic AI orchestrator)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=openai:gpt-4
      
      # ========================================
      # MAJOR TECH COMPANY API KEYS
      # ========================================
      
      # Google Cloud & AI
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      
      # Microsoft Azure
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY:-}
      - AZURE_SEARCH_ENDPOINT=${AZURE_SEARCH_ENDPOINT:-}
      - AZURE_SEARCH_KEY=${AZURE_SEARCH_KEY:-}
      
      # Amazon AWS
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      
      # NVIDIA
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      
      # Cohere
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      
      # Mistral AI
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      
      # Groq
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      
      # Python settings
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/mcp
      
      # Node settings
      - NODE_ENV=production
      
    networks:
      - ai-network
    volumes:
      - mcp_ecosystem_cache:/home/mcpuser/.cache
      - mcp_ecosystem_data:/home/mcpuser/data
      - ./config:/mcp/config:ro
    labels:
      - "mcp.ecosystem=true"
      - "mcp.version=1.0.0"
      - "mcp.sdks=pydantic-ai,fastmcp,node-sdk"
      - "mcp.tools=youtube,arxiv,wikipedia,web-search,testing,storage"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  

volumes:
  mcp_ecosystem_cache:
    driver: local
  mcp_ecosystem_data:
    driver: local

networks:
  ai-network:
    name: universal-ai-network
    external: true
