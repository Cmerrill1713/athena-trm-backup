# Auto-Promotion Recording Rules and Alerts

groups:
  - name: auto_promotion_rules
    interval: 30s
    rules:
      # Canary improvement over 48h (for promotion consideration)
      - record: canary:improvement_48h
        expr: |
          (
            sum(increase(routing_success_total{bucket="canary"}[48h]))
            / sum(increase(routing_decisions_total{bucket="canary"}[48h]))
          )
          -
          (
            sum(increase(routing_success_total{bucket="control"}[48h]))
            / sum(increase(routing_decisions_total{bucket="control"}[48h]))
          )

      # Canary sample count (48h)
      - record: canary:sample_count_48h
        expr: sum(increase(routing_decisions_total{bucket="canary"}[48h]))

      # Control sample count (48h)
      - record: control:sample_count_48h
        expr: sum(increase(routing_decisions_total{bucket="control"}[48h]))

  - name: auto_promotion_alerts
    rules:
      # Alert: Canary ready for promotion consideration
      - alert: CanaryPromotionEligible
        expr: |
          canary:improvement_48h > 0.03
          and canary:sample_count_48h >= 50
          and control:sample_count_48h >= 50
        for: 48h  # Sustained for 48 hours
        labels:
          severity: info
          component: canary
        annotations:
          summary: "Canary eligible for promotion"
          description: |
            Canary has shown {{ $value | humanizePercentage }} improvement over control for 48h.
            Sample sizes: canary={{ $labels.canary_samples }}, control={{ $labels.control_samples }}.
            Run: make canary-auto-promote

      # Alert: Promotion timer tracking
      - alert: CanaryPromotionInProgress
        expr: |
          canary:improvement_48h > 0.02
          and canary:sample_count_48h >= 30
        for: 24h
        labels:
          severity: info
          component: canary
        annotations:
          summary: "Canary trending better (24h into 48h window)"
          description: "Canary ahead by {{ $value | humanizePercentage }}. Monitor for another 24h before promotion."
