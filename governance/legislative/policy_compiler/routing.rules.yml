# Routing SLO Recording Rules & Alerts

groups:
  - name: routing_slo_rules
    interval: 30s
    rules:
      # Canary success rate (10m window)
      - record: canary:success_rate:10m
        expr: |
          sum(rate(routing_success_total[10m])) by (model,env) /
          sum(rate(routing_decisions_total[10m])) by (model,env)

      # Control success rate (10m window)
      - record: control:success_rate:10m
        expr: |
          sum(rate(routing_success_total{model!~".*@canary"}[10m])) by (env) /
          sum(rate(routing_decisions_total{model!~".*@canary"}[10m])) by (env)

  - name: promotions_recording_rules
    interval: 30s
    rules:
      # Promotions in last 24h
      - record: trm:promotions_24h
        expr: increase(promotions_total{env="$env"}[24h])

      # Promotions in last 1h
      - record: trm:promotions_last_1h
        expr: increase(promotions_total{env="$env"}[1h])

      # Promotion rate (per minute)
      - record: trm:promotion_rate_5m
        expr: rate(promotions_total{env="$env"}[5m])

  - name: routing_alerts
    rules:
      # Circuit breaker alerts
      - alert: BreakerOpen
        expr: breaker_open{env=~".*"} == 1
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Circuit breaker open for {{ $labels.model }}"
          description: "Auto-fallback engaged for {{ $labels.model }}. Check logs and restart if needed."

      - alert: BreakerOpenTooLong
        expr: breaker_open == 1 and breaker_open_duration_seconds > 600
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Circuit breaker stuck open for {{ $labels.model }}"
          description: "{{ $labels.model }} breaker has been open for {{ $value }}s (>10m). Manual intervention required."

      - alert: BreakerTripSpike
        expr: increase(breaker_trips_total[5m]) > 3
        for: 1m
        labels:
          severity: warn
        annotations:
          summary: "Circuit breaker trip spike for {{ $labels.model }}"
          description: "{{ $labels.model }} breaker tripped {{ $value }} times in 5m. Investigate instability."

      # Canary alerts
      - alert: CanaryTrailing
        expr: |
          canary:success_rate:10m{model=~".*@canary"} <
          on(env) group_left control:success_rate:10m - 0.05
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Canary trailing control"
          description: "Canary success rate is >5% below control for 10m. Auto-rollback may trigger."

      # Router health
      - alert: RouterDeadman
        expr: rate(routing_decisions_total[15m]) == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "No routing traffic"
          description: "No routing decisions in 30m. Check router or upstream services."

  - name: promotions_alerts
    interval: 30s
    rules:
      - alert: PromotionSpike
        expr: increase(promotions_total{env="$env", action="promotion"}[1h]) > 3
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "High number of promotions"
          description: "More than 3 promotions in the last hour. Check lineage and canary evaluator."
