# Production Reliability Addons - The Missing Pieces
# Add these to your enterprise stack for production-grade telemetry and reliability

services:
  # ============================================================================
  # TRACING: OpenTelemetry Collector + Tempo
  # ============================================================================

  otel-collector:
    image: otel/opentelemetry-collector:0.103.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - "./otel/collector-config.yaml:/etc/otel/config.yaml:ro"
    ports:
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    networks:
      - monitoring
      - enterprise
    depends_on:
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.4.1
    command: -config.file=/etc/tempo/config.yaml
    volumes:
      - "./tempo/config.yaml:/etc/tempo/config.yaml:ro"
      - "tempo-data:/var/tempo"
    ports:
      - "3200:3200"    # Tempo UI/API
    networks:
      - monitoring
    restart: unless-stopped

  # ============================================================================
  # LOGGING: Loki + Promtail
  # ============================================================================

  loki:
    image: grafana/loki:2.9.5
    command: -config.file=/etc/loki/config.yml
    volumes:
      - "./loki/config.yml:/etc/loki/config.yml:ro"
      - "loki-data:/loki"
    ports:
      - "3100:3100"    # Loki API
    networks:
      - monitoring
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.5
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - "./promtail/config.yml:/etc/promtail/config.yml:ro"
      - "/var/lib/docker/containers:/var/lib/docker/containers:ro"
      - "/var/log:/var/log:ro"
    networks:
      - monitoring
    depends_on:
      - loki
    restart: unless-stopped

  # ============================================================================
  # BLACKBOX MONITORING: Outside-in checks
  # ============================================================================

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - "./prometheus/blackbox.yml:/etc/blackbox/blackbox.yml:ro"
    ports:
      - "9115:9115"    # Blackbox metrics
    networks:
      - monitoring
    restart: unless-stopped

  # ============================================================================
  # CONTAINER METRICS: cAdvisor
  # ============================================================================

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports:
      - "8082:8080"    # cAdvisor UI
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker/:/var/lib/docker:ro"
    networks:
      - monitoring
    privileged: true
    restart: unless-stopped

  # ============================================================================
  # EDGE: Traefik (TLS, routing, rate limiting)
  # ============================================================================

  traefik:
    image: traefik:v3.0
    command:
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--api.dashboard=true"
      - "--api.insecure=true"  # For dev - remove in prod
    ports:
      - "80:80"       # HTTP
      - "443:443"     # HTTPS
      - "8084:8080"   # Traefik dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro"
    networks:
      - enterprise
      - monitoring
    restart: unless-stopped

  # ============================================================================
  # DATABASE: Flyway migrations
  # ============================================================================

  flyway:
    image: flyway/flyway:10-alpine
    command: -url=jdbc:postgresql://athena-postgres:5432/universal_ai_tools -user=postgres -password=postgres migrate
    volumes:
      - "./db/migrations:/flyway/sql:ro"
    networks:
      - enterprise
    depends_on:
      - athena-postgres
    restart: "no"  # Run once on startup

  # ============================================================================
  # STORAGE: MinIO (S3-compatible object storage)
  # ============================================================================

  minio:
    image: minio/minio:RELEASE.2024-09-01T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: change-me-now
    ports:
      - "9000:9000"    # MinIO API
      - "9001:9001"    # MinIO Console
    volumes:
      - "minio:/data"
    networks:
      - enterprise
    restart: unless-stopped

  # ============================================================================
  # FEATURE FLAGS: Unleash
  # ============================================================================

  unleash:
    image: unleashorg/unleash-server:5
    environment:
      DATABASE_URL: postgres://postgres:postgres@athena-postgres:5432/universal_ai_tools
      INIT_ADMIN_API_TOKENS: '["s*:*.api_token.*"]'
    ports:
      - "4242:4242"    # Unleash UI
    networks:
      - enterprise
    depends_on:
      - athena-postgres
    restart: unless-stopped

volumes:
  tempo-data:
  loki-data:
  minio:

networks:
  enterprise:
    external: true
  monitoring:
    external: true
