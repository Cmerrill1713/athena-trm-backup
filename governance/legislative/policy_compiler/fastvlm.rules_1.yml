# FastVLM Recording Rules and Alerts
# High-performance pre-aggregated metrics for fast dashboard queries

groups:
  - name: fastvlm_recording_rules
    interval: 30s
    rules:
      # Pre-aggregate p50, p95, p99 latency (fast dashboard queries)
      - record: fastvlm:latency_p50_ms:5m
        expr: histogram_quantile(0.50, sum by (le, env, build) (rate(fastvlm_latency_ms_bucket[5m])))
      
      - record: fastvlm:latency_p95_ms:5m
        expr: histogram_quantile(0.95, sum by (le, env, build) (rate(fastvlm_latency_ms_bucket[5m])))
      
      - record: fastvlm:latency_p99_ms:5m
        expr: histogram_quantile(0.99, sum by (le, env, build) (rate(fastvlm_latency_ms_bucket[5m])))
      
      # Success rate (pre-calculated)
      - record: fastvlm:success_rate:5m
        expr: |
          sum by (env, build) (rate(fastvlm_requests_total{status="success"}[5m]))
          /
          sum by (env, build) (rate(fastvlm_requests_total[5m]))
      
      # Request rate per minute
      - record: fastvlm:requests_per_minute:5m
        expr: sum by (env, build) (rate(fastvlm_requests_total[5m])) * 60
      
      # Average image size
      - record: fastvlm:avg_image_size_bytes:5m
        expr: |
          sum by (env, build) (rate(fastvlm_image_size_bytes_sum[5m]))
          /
          sum by (env, build) (rate(fastvlm_image_size_bytes_count[5m]))

  - name: fastvlm_alerts
    rules:
      # Alert: High latency (p95 > 3s for 10 minutes)
      - alert: FastVLMHighLatency
        expr: fastvlm:latency_p95_ms:5m > 3000
        for: 10m
        labels:
          severity: warning
          component: fastvlm
        annotations:
          summary: "FastVLM p95 latency is high"
          description: "FastVLM p95 latency is {{ $value }}ms (threshold: 3000ms) for {{ $labels.env }}"
      
      # Alert: Low success rate (< 95% for 5 minutes)
      - alert: FastVLMLowSuccessRate
        expr: fastvlm:success_rate:5m < 0.95
        for: 5m
        labels:
          severity: warning
          component: fastvlm
        annotations:
          summary: "FastVLM success rate is low"
          description: "FastVLM success rate is {{ $value | humanizePercentage }} (threshold: 95%) for {{ $labels.env }}"
      
      # Alert: Server down (no requests in 5 minutes)
      - alert: FastVLMServerDown
        expr: rate(fastvlm_requests_total[5m]) == 0
        for: 5m
        labels:
          severity: critical
          component: fastvlm
        annotations:
          summary: "FastVLM server appears down"
          description: "No requests received in 5 minutes for {{ $labels.env }}"
      
      # Alert: High active requests (potential overload)
      - alert: FastVLMHighLoad
        expr: fastvlm_active_requests > 10
        for: 2m
        labels:
          severity: warning
          component: fastvlm
        annotations:
          summary: "FastVLM has high concurrent load"
          description: "FastVLM has {{ $value }} active requests (threshold: 10) for {{ $labels.env }}"

  - name: fastvlm_reliability
    rules:
      # Alert: Watchdog is restarting things (flapping detection)
      - alert: FastVLMRestarts
        expr: increase(fastvlm_watchdog_restarts_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
          component: fastvlm
        annotations:
          summary: "FastVLM restarted in the last 10m"
          description: "Watchdog restart count: {{ $value }} (check /tmp/fastvlm_watchdog.log for root cause)"
      
      # Alert: No traffic deadman (service up but unused)
      - alert: FastVLMNoRequests
        expr: rate(fastvlm_requests_total[15m]) == 0
        for: 30m
        labels:
          severity: info
          component: fastvlm
        annotations:
          summary: "No FastVLM requests in 30m"
          description: "May indicate upstream routing issue or idle system. Check if vision routing is working."
      
      # Alert: Frequent restarts (flapping)
      - alert: FastVLMFlapping
        expr: increase(fastvlm_watchdog_restarts_total[1h]) > 3
        for: 5m
        labels:
          severity: critical
          component: fastvlm
        annotations:
          summary: "FastVLM restarting too frequently"
          description: "{{ $value }} restarts in last hour - investigate /tmp/fastvlm_watchdog.log and /tmp/fastvlm_server.log"
      
      # Alert: Circuit breaker tripped
      - alert: FastVLMCircuitBreakerOpen
        expr: fastvlm_watchdog_circuit_open{env="$env"} == 1
        for: 5m
        labels:
          severity: critical
          component: fastvlm
        annotations:
          summary: "FastVLM circuit breaker OPEN"
          description: "Watchdog halted restarts due to flapping (>3 in 10min). Investigate root cause before manual intervention."

