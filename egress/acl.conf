# Squid ACL Configuration for Controlled Egress
# Allowlist for research paper sources only

# Allowed research domains
acl research_sources dstdomain .arxiv.org
acl research_sources dstdomain .doi.org
acl research_sources dstdomain .crossref.org
acl research_sources dstdomain .acm.org
acl research_sources dstdomain .ieee.org
acl research_sources dstdomain .semanticscholar.org
acl research_sources dstdomain .ncbi.nlm.nih.gov
acl research_sources dstdomain .pubmed.gov
acl research_sources dstdomain .scholar.google.com
acl research_sources dstdomain .springer.com
acl research_sources dstdomain .sciencedirect.com
acl research_sources dstdomain .nature.com
acl research_sources dstdomain .researchgate.net
acl research_sources dstdomain .mdpi.com
acl research_sources dstdomain .plos.org
acl research_sources dstdomain .biorxiv.org

# Allow HTTPS connections
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https

# Deny direct IP access (domain names only)
acl numeric_IPs dstdom_regex ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$

# Access rules
http_access deny numeric_IPs
http_access allow research_sources Safe_ports
http_access allow research_sources SSL_ports
http_access deny all

# No request body size limit for PDF downloads
request_body_max_size 0 KB

# Logging for audit
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log

# Cache settings (optional - speed up repeated fetches)
cache_dir ufs /var/spool/squid 1000 16 256
maximum_object_size 100 MB

