# NeuroForge Capability Routing Policies
# Constraints-first, agent-agnostic

policy_version: "v1"

# Hard constraints (never violated)
constraints:
  offline_only: true                # All execution stays local
  pii_never_leave_local: true       # PII never sent to external APIs
  max_latency_ms: 1500              # Max acceptable latency

# Capability routing configuration
routing:
  summarize:
    prefer: ["any"]                 # "any" keeps it agent-agnostic
    temp: 0.2
    max_tokens: 512
    shadow_percent: 0.2             # 20% shadow execution for comparison
    min_samples_for_promotion: 5

  plan:
    prefer: ["any"]
    temp: 0.3
    max_tokens: 1024
    shadow_percent: 0.1
    min_samples_for_promotion: 5

  generate:
    prefer: ["any"]
    temp: 0.4
    max_tokens: 2048
    shadow_percent: 0.15
    min_samples_for_promotion: 5

  reason:
    prefer: ["any"]
    temp: 0.5
    max_tokens: 1536
    shadow_percent: 0.1
    min_samples_for_promotion: 10

# Scorecard weights for composite scoring
scorecard_weights:
  correctness: 0.45    # Did it get the answer right?
  structure:   0.15    # Proper output format?
  safety:      0.15    # No PII leakage, policy violations?
  latency:     0.15    # Fast enough?
  acceptance:  0.10    # User approved? (manual feedback)

# Quality thresholds
thresholds:
  composite_min: 0.70  # Minimum acceptable composite score
  latency_warn: 1000   # Warn if latency exceeds (ms)
  safety_required: 1.0 # Safety must be perfect
