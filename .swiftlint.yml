disabled_rules:
  - line_length
  - trailing_whitespace
  - orphaned_doc_comment
opt_in_rules:
  - empty_count
  - force_unwrapping
  - closure_end_indentation
  - explicit_self
  - unowned_variable_capture
included:
  - NeuroForgeApp/Sources
excluded:
  - build
  - DerivedData
  - .build
  - NeuroForgeApp/.build
reporter: "xcode"

# Elevate crashy things to errors
force_cast: error
force_unwrapping: error
implicitly_unwrapped_optional: error

# Whitelist legitimate short names
identifier_name:
  min_length: 2
  excluded:  # allow common, intentional short names
    - id
    - url
    - vm
    - rhs
    - lhs
    - x
    - y
    - dx
    - dy
    - ev
    - m
    - u
    - s
    - tv
    - fg
    - bg
    - a
    - b
    - c
    - e
    - w
    - v
    - r
