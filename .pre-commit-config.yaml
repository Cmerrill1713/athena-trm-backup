repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
  - repo: local
    hooks:
      - id: swiftlint
        name: swiftlint
        entry: bash -lc 'swiftlint'
        language: system
        pass_filenames: false
        files: ^NeuroForgeApp/Sources/.*\.swift$
      - id: ruff
        name: ruff
        entry: ruff check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: mypy scripts src --ignore-missing-imports
        language: system
        pass_filenames: false
      - id: shellcheck
        name: shellcheck
        entry: bash -lc 'find scripts -name "*.sh" -exec shellcheck -x {} \;'
        language: system
        pass_filenames: false
      - id: yamllint
        name: yamllint
        entry: yamllint -s .
        language: system
        pass_filenames: false
