version: governance.policy.v2
router:
  default_pattern: PEC
  enable_tot_if:
    calibrated_uncertainty_ge: 0.35
    branches_max: 3
    depth_max: 2
  enable_got_if:
    value_fn_signal_ge: 0.60
    nodes_max: 16
    backedges_max: 4
budgets:
  tokens_max: 12000
  wall_time_s_max: 180
rollout:
  mode: canary
  sample: 0.10
promote_requirements:
  solve_rate_delta_ge: 0.02
  violation_rate_le_over_baseline: 0.005
  latency_p95_le_over_baseline: 0.25
  ece_post_le: 0.06
  edge_case_score_ge: 0.80
  consistency_index_ge: 0.90
rollback_triggers:
  - solve_rate_delta_le: -0.03
  - violation_rate_delta_ge: 0.01
  - ece_drift_ge: 0.03
  - secret_leak: true
