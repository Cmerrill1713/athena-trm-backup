events {
    worker_connections 1024;
}

http {
    # Streaming-friendly settings
    proxy_buffering off;
    proxy_request_buffering off;
    chunked_transfer_encoding on;
    
    # Timeouts for long-running streams
    proxy_connect_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
    send_timeout 3600s;

    upstream openai_backend {
        server openai-compat:3000;
    }

    upstream webui_backend {
        server open-webui:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Open WebUI (main UI)
        location / {
            proxy_pass http://webui_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for UI
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # OpenAI API (for direct access)
        location /v1/ {
            proxy_pass http://openai_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Streaming support
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
            
            # CORS headers
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Health checks
        location /health {
            proxy_pass http://openai_backend/health;
            access_log off;
        }
    }
}

