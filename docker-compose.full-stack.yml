  #   1. Pull image on a machine with internet: docker pull ghcr.io/open-webui/open-webui:main
  #   2. Save image: docker save ghcr.io/open-webui/open-webui:main | gzip > open-webui.tar.gz
  #   3. Load on this machine: docker load < open-webui.tar.gz
  #   4. Uncomment service below
