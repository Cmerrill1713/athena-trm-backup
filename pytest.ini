[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    smoke: minimal contract checks (fast, always run)
    e2e: end-to-end bridge checks (requires bridge running)
    backends: direct UAT/Athena checks (requires backends)
    slo: latency SLO validation (performance critical)
    security: auth and rate limiting tests
