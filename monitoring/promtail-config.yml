server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Stack verification logs
  - job_name: stack_verify
    static_configs:
      - targets:
          - localhost
        labels:
          job: stack_verify
          __path__: /var/log/stack_verify.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\S+)\s+(?P<level>\S+)\s+(?P<message>.*)$'
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339

  # Service logs
  - job_name: platform_services
    static_configs:
      - targets:
          - localhost
        labels:
          job: platform_services
          __path__: /var/log/platform/*.log
    pipeline_stages:
      - regex:
          expression: '^\[(?P<service>\w+)\]\s+(?P<level>\w+)\s+(?P<message>.*)$'
      - labels:
          service:
          level:

  # MCP logs
  - job_name: mcp_services
    static_configs:
      - targets:
          - localhost
        labels:
          job: mcp_services
          __path__: /var/log/mcp/*.log
    pipeline_stages:
      - json:
          expressions:
            service: service
            level: level
            message: message
      - labels:
          service:
          level:

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/system.log
