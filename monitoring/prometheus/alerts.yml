groups:
  - name: athena_critical
    interval: 30s
    rules:
      # Router Down - Page immediately
      - alert: RouterDown
        expr: up{job="athena-router"} == 0
        for: 1m
        labels:
          severity: critical
          component: router
        annotations:
          summary: "Athena Router is DOWN"
          description: "Router on port 9113 has been unreachable for 1+ minute. All AI requests are failing."

      # MCP Tool Failure Rate > 5%
      - alert: MCPToolFailureRateHigh
        expr: (rate(mcp_tool_errors_total[10m]) / rate(mcp_tool_calls_total[10m])) > 0.05
        for: 10m
        labels:
          severity: warning
          component: mcp
        annotations:
          summary: "MCP tool failure rate > 5%"
          description: "MCP tools failing at {{ $value | humanizePercentage }} over last 10 minutes"

      # Router Latency (Time to First Token) > 1.0s
      - alert: RouterTTFTHigh
        expr: histogram_quantile(0.95, rate(athena_router_ttft_seconds_bucket[5m])) > 1.0
        for: 5m
        labels:
          severity: warning
          component: router
        annotations:
          summary: "Router TTFT p95 > 1.0s"
          description: "95th percentile time-to-first-token is {{ $value }}s (threshold: 1.0s)"

      # Orchestrator Down
      - alert: OrchestratorDown
        expr: up{job="governance-orchestrator"} == 0
        for: 2m
        labels:
          severity: critical
          component: governance
        annotations:
          summary: "Governance Orchestrator is DOWN"
          description: "Orchestrator unreachable for 2+ minutes. Verdict processing stopped."

      # AGI Core Down
      - alert: AGICoreDown
        expr: up{job="agi-core"} == 0
        for: 2m
        labels:
          severity: high
          component: agi
        annotations:
          summary: "AGI Core is DOWN"
          description: "AGI Core service unreachable for 2+ minutes."

      # High Error Rate (>10% of requests failing)
      - alert: HighErrorRate
        expr: (rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m])) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "{{ $labels.service }} error rate: {{ $value | humanizePercentage }}"

      # Disk Space Low
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space running low"
          description: "Available disk space: {{ $value | humanizePercentage }}"

      # Memory Usage High
      - alert: MemoryUsageHigh
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage critical"
          description: "Available memory: {{ $value | humanizePercentage }}"

  - name: athena_performance
    interval: 1m
    rules:
      # Router Queue Depth
      - alert: RouterQueueDepthHigh
        expr: router_queue_depth > 100
        for: 5m
        labels:
          severity: warning
          component: router
        annotations:
          summary: "Router queue depth high"
          description: "Router queue has {{ $value }} pending requests"

      # Canary Window Failures
      - alert: CanaryWindowFailing
        expr: rate(governance_canary_failures_total[15m]) > 0.1
        for: 15m
        labels:
          severity: warning
          component: canary
        annotations:
          summary: "Canary windows failing"
          description: "Canary failure rate: {{ $value }} failures/min"

      # Graph-of-Code Ingestion Slow
      - alert: GOCIngestionSlow
        expr: histogram_quantile(0.95, rate(goc_ingest_duration_seconds_bucket[5m])) > 60
        for: 10m
        labels:
          severity: info
          component: goc
        annotations:
          summary: "Graph-of-Code ingestion slow"
          description: "p95 ingestion time: {{ $value }}s (threshold: 60s)"
