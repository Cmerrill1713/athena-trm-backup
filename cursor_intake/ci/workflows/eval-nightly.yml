name: Nightly Eval (Golden)

on:
  schedule:
    - cron: "17 3 * * *"   # 03:17 UTC nightly
  workflow_dispatch:

jobs:
  nightly-eval:
    runs-on: macos-13
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        working-directory: orchestrator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Orchestrator API
        working-directory: orchestrator
        run: |
          nohup python -m uvicorn api:app --host 127.0.0.1 --port 8765 > api.log 2>&1 &
          sleep 2
          curl -sSf http://127.0.0.1:8765/health

      - name: Start Eval API
        working-directory: orchestrator
        run: |
          nohup python -m uvicorn tools.eval_api:app --host 127.0.0.1 --port 8788 > eval.log 2>&1 &
          sleep 2

      - name: Run goldens (summarize + plan)
        working-directory: orchestrator
        run: |
          curl -sSf -X POST http://127.0.0.1:8788/eval/run \
            -H 'Content-Type: application/json' -d '{"capability":"summarize","limit":0}' > nightly_sum.json
          curl -sSf -X POST http://127.0.0.1:8788/eval/run \
            -H 'Content-Type: application/json' -d '{"capability":"plan","limit":0}' > nightly_plan.json
          echo "summarize:"; jq '.passed, .total' nightly_sum.json || cat nightly_sum.json
          echo "plan:"; jq '.passed, .total' nightly_plan.json || cat nightly_plan.json

      - name: Enforce thresholds
        working-directory: orchestrator
        run: |
          python3 scripts/check_eval_threshold.py nightly_sum.json nightly_plan.json

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval
          path: |
            orchestrator/nightly_sum.json
            orchestrator/nightly_plan.json
            orchestrator/api.log
            orchestrator/eval.log
