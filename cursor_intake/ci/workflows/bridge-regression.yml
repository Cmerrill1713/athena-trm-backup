name: bridge-regression
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: '3.11' }
    - run: pip install -r bridge/requirements.txt pytest requests
    - run: nohup uvicorn adapter:app --host 0.0.0.0 --port 8014 &
      working-directory: bridge
    - run: sleep 3
    - run: BASE=http://127.0.0.1:8014 pytest -q tests/test_chat_payloads.py
