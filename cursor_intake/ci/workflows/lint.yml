name: Lint

on:
  push:
    branches: [main, develop, feature/*, fix/*]
  pull_request:
    branches: [main, develop]

jobs:
  # REQUIRED: Fail on syntax errors and undefined names
  lint-syntax:
    name: "Syntax Check (Required)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Check syntax only (E9, F63, F7, F82)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Compile all Python files
        run: python3 -m compileall -q .

  # ADVISORY: Report style issues but don't block
  lint-style:
    name: "Style Check (Advisory)"
    runs-on: ubuntu-latest
    if: always()
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Run full flake8 (advisory)
        run: flake8 . || true

      - name: Report status
        if: always()
        run: |
          echo "ℹ️  Style check completed (non-blocking)"
          echo "Review warnings above to improve code quality incrementally"

