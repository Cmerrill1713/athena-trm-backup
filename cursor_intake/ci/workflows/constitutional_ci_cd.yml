# Constitutional CI/CD Integration
# Treats constitutional checks like build tests

name: Constitutional CI/CD

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main, production ]
  schedule:
    # Daily validation at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      check_type:
        description: 'Type of constitutional check'
        required: true
        default: 'pre-deploy'
        type: choice
        options:
          - pre-deploy
          - daily-validation
          - chaos-drill

# Secrets are optional - workflows handle missing gracefully

jobs:
  constitutional-checks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psycopg2-binary requests

    - name: Download hardening bundle
      run: |
        curl -fsSL https://raw.githubusercontent.com/your-repo/constitutional_hardening_bundle.sql -o constitutional_hardening_bundle.sql

    - name: Setup database (if needed)
      run: |
        # Only run on first deployment or schema changes
        if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
          if [ -n "${{ secrets.DATABASE_URL }}" ]; then
            psql ${{ secrets.DATABASE_URL }} -f constitutional_hardening_bundle.sql || echo "Schema already exists"
          else
            echo "DATABASE_URL secret not configured, skipping database setup"
          fi
        fi

    - name: Run Constitutional Checks
      id: constitutional
      run: |
        case "${{ github.event.inputs.check_type || 'pre-deploy' }}" in
          "pre-deploy")
            echo "Running pre-deployment constitutional checks..."
            if [ -n "${{ secrets.DATABASE_URL }}" ]; then
              python3 run_constitutional_validation.py --db-url "${{ secrets.DATABASE_URL }}" --format json > constitutional_results.json
            else
              echo "DATABASE_URL not configured, running validation without database"
              python3 run_constitutional_validation.py --format json > constitutional_results.json
            fi
            ;;
          "daily-validation")
            echo "Running daily constitutional validation..."
            bash constitutional_operations_automation.sh daily-validation
            ;;
          "chaos-drill")
            echo "Running chaos drill..."
            bash constitutional_operations_automation.sh chaos-drill strategy_quarantine
            ;;
        esac

    - name: Parse Results
      id: results
      run: |
        if [[ -f constitutional_results.json ]]; then
          COMPLIANCE_RATE=$(jq -r '.summary.compliance_rate' constitutional_results.json)
          FAILED_CHECKS=$(jq -r '.summary.failed' constitutional_results.json)
          OVERALL_STATUS=$(jq -r '.summary.overall_status' constitutional_results.json)

          echo "compliance_rate=$COMPLIANCE_RATE" >> $GITHUB_OUTPUT
          echo "failed_checks=$FAILED_CHECKS" >> $GITHUB_OUTPUT
          echo "overall_status=$OVERALL_STATUS" >> $GITHUB_OUTPUT

          echo "Compliance Rate: ${COMPLIANCE_RATE}%"
          echo "Failed Checks: $FAILED_CHECKS"
          echo "Overall Status: $OVERALL_STATUS"
        else
          echo "No results file found - checking automation logs"
          if [[ -f "/tmp/constitutional_operations.log" ]]; then
            if grep -q "CRITICAL" /tmp/constitutional_operations.log; then
              echo "overall_status=FAIL" >> $GITHUB_OUTPUT
            else
              echo "overall_status=PASS" >> $GITHUB_OUTPUT
            fi
          else
            echo "overall_status=UNKNOWN" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Upload results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: constitutional-results-${{ github.run_id }}
        path: |
          constitutional_results.json
          /tmp/constitutional_operations.log

    - name: Constitutional Gate
      if: steps.results.outputs.overall_status == 'FAIL'
      run: |
        echo "🚫 CONSTITUTIONAL CHECKS FAILED"
        echo "Compliance Rate: ${{ steps.results.outputs.compliance_rate }}%"
        echo "Failed Checks: ${{ steps.results.outputs.failed_checks }}"

        # Show which checks failed
        if [[ -f constitutional_results.json ]]; then
          echo "Failed checks:"
          jq -r '.checks | to_entries[] | select(.value.status == "FAIL") | "- \(.key): \(.value.value) (threshold: \(.value.threshold))"' constitutional_results.json
        fi

        exit 1

    - name: Success Notification
      if: ${{ steps.results.outputs.overall_status == 'PASS' && secrets.SLACK_WEBHOOK != '' }}
      run: |
        curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
             -H 'Content-type: application/json' \
             --data "{\"text\":\"✅ Constitutional checks PASSED (${{ steps.results.outputs.compliance_rate }}% compliance)\"}"

    - name: Failure Notification
      if: ${{ failure() && secrets.SLACK_WEBHOOK != '' }}
      run: |
        curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
             -H 'Content-type: application/json' \
             --data "{\"text\":\"🚫 Constitutional checks FAILED - blocking deployment\"}"

  deploy-gate:
    runs-on: ubuntu-latest
    needs: constitutional-checks
    if: github.ref == 'refs/heads/main' && needs.constitutional-checks.result == 'success'

    steps:
    - name: Deploy to Production
      run: |
        echo "🚀 Proceeding with production deployment"
        echo "All constitutional checks passed!"
        # Add your actual deployment commands here
